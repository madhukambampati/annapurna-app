name: One-time final prelaunch verification

on:
  push:
    branches: [ui-redesign-v1]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Commit whitespace sanity
        run: git show --check --oneline --no-renames HEAD
      - name: Full automated regression suite
        run: npm test
      - name: Live health, security, routing, and deployment parity
        run: |
          set -euo pipefail
          base='https://annapurna-maddy-kw.fly.dev'
          curlx() { curl --retry 3 --retry-all-errors --fail --silent --show-error --max-time 20 "$@"; }

          curlx "$base/health" -o /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

          curlx -D /tmp/home.headers "$base/" -o /tmp/index.html
          curlx "$base/desk" -o /tmp/desk.html
          curlx "$base/app.js" -o /tmp/app.js
          curlx "$base/desk.js" -o /tmp/desk.js
          curlx "$base/manifest.webmanifest" -o /tmp/manifest.webmanifest
          curlx "$base/web/menu" -o /tmp/menu.json

          grep -qi '^content-security-policy:' /tmp/home.headers
          grep -qi '^x-content-type-options: *nosniff' /tmp/home.headers
          grep -qi '^x-frame-options: *DENY' /tmp/home.headers
          grep -qi '^referrer-policy: *no-referrer' /tmp/home.headers
          grep -qi '^cache-control: *no-store' /tmp/home.headers
          grep -qi '^strict-transport-security:' /tmp/home.headers

          node -e 'const x=require("fs").readFileSync("/tmp/menu.json","utf8"); const j=JSON.parse(x); if(!Array.isArray(j.items)||!j.items.length) process.exit(1)'
          grep -q 'Annapurna' /tmp/index.html
          grep -q 'Annapurna' /tmp/desk.html

          cmp -s public/index.html /tmp/index.html
          cmp -s public/desk.html /tmp/desk.html
          cmp -s public/app.js /tmp/app.js
          cmp -s public/desk.js /tmp/desk.js
          cmp -s public/manifest.webmanifest /tmp/manifest.webmanifest

          code=$(curl --silent --show-error --max-time 20 -o /tmp/browser404.html -w '%{http_code}' "$base/definitely-not-a-real-page")
          test "$code" = '404'
          grep -q "That page isn't here" /tmp/browser404.html
          grep -q 'Back to home' /tmp/browser404.html

          code=$(curl --silent --show-error --max-time 20 -o /tmp/api404.json -w '%{http_code}' "$base/api/definitely-not-real")
          test "$code" = '404'
          grep -q '"error":"Not found"' /tmp/api404.json

          code=$(curl --silent --show-error --max-time 20 -o /tmp/owner401.json -w '%{http_code}' "$base/api/state")
          test "$code" = '401'
          grep -q 'Owner token required' /tmp/owner401.json

          grep -q 'saved chat for a different contact' /tmp/app.js
          grep -q 'Your saved chat is no longer available' /tmp/app.js

          echo 'FINAL_CHECK: live assets exactly match ui-redesign-v1 customer/owner frontend'
          echo 'FINAL_CHECK: security headers, branded 404, API 404, owner auth, menu and health all passed'
