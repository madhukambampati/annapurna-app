name: Post-launch enhancements

on:
  push:
    branches:
      - postlaunch-enhancements
    paths:
      - .github/workflows/postlaunch-enhancements.yml
      - scripts/postlaunch-enhancements.cjs
      - scripts/postlaunch-fix-tests.cjs

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: postlaunch-enhancements
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply post-launch enhancements
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'public/app.js';
          const s = fs.readFileSync(file, 'utf8');
          fs.writeFileSync(file, s.replace(/\\u00b7/g, '·'));
          NODE
          node scripts/postlaunch-enhancements.cjs
          node scripts/postlaunch-fix-tests.cjs
      - name: Check browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit enhancements and remove temporary patch files
        shell: bash
        run: |
          rm scripts/postlaunch-enhancements.cjs
          rm scripts/postlaunch-fix-tests.cjs
          rm .github/workflows/postlaunch-enhancements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add post-launch ordering and UI enhancements"
          git push origin postlaunch-enhancements
