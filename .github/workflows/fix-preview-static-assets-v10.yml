name: Fix preview static assets V10
on:
  push:
    branches: [ui-preview]
    paths:
      - '.github/workflows/fix-preview-static-assets-v10.yml'
permissions:
  contents: write
jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply server asset allowlist fix
        run: node scripts/fix-preview-static-assets-v10.cjs
      - name: Verify mappings and referenced files
        run: |
          grep -q '"/heritage-v9.css"' src/server.ts
          grep -q '"/assets/heritage-hero-v5.svg"' src/server.ts
          grep -q '"/assets/combos-v5.svg"' src/server.ts
          test -f public/heritage-v9.css
          test -f public/assets/heritage-hero-v5.svg
          test -f public/assets/combos-v5.svg
          test -f public/assets/weekly-plans-v5.svg
          test -f public/assets/orders-v5.svg
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested fix and clean temporary runner
        run: |
          rm -f scripts/fix-preview-static-assets-v10.cjs .github/workflows/fix-preview-static-assets-v10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Serve preview CSS and artwork assets V10'
          git push origin HEAD:ui-preview
