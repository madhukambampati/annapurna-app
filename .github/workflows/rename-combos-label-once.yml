name: One-time customer combo label rename
on:
  push:
    branches: [main]
    paths:
      - '.github/rename-combos-label-trigger.txt'
permissions:
  contents: write
jobs:
  rename-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply customer-facing label rename
        run: python .github/scripts/rename-combos-label.py
      - name: Scope and syntax checks
        run: |
          git diff --check
          node --check public/app.js
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          echo "Changed: $changed"
          test "$changed" = "public/app.js public/index.html "
      - name: Full regression suite
        run: |
          npm ci
          npm test
      - name: Commit label rename
        run: |
          git config user.name 'madhukambampati'
          git config user.email '85366523+madhukambampati@users.noreply.github.com'
          git add public/app.js public/index.html
          git commit -m 'Rename customer Weekend Combos label to Combos'
          git push origin HEAD:main
