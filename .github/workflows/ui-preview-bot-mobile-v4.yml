name: UI preview bot mobile V4 regression

on:
  push:
    branches: [ui-preview]
    paths:
      - 'scripts/ui-preview-bot-mobile-v4.cjs'
      - '.github/workflows/ui-preview-bot-mobile-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply V4 preview redesign
        run: node scripts/ui-preview-bot-mobile-v4.cjs
      - name: Verify V4 markers and no whole-page horizontal pan
        run: |
          grep -q 'heritageBotMobileV4' public/index.html
          grep -q 'What would you like to do?' public/index.html
          grep -q 'Combos · Weekly Plans · Orders' public/index.html
          grep -q 'tile-menu{display:none!important}' public/index.html
          grep -q 'overflow-x:hidden!important' public/index.html
      - name: Browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested preview and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ui-preview-bot-mobile-v4.cjs
          rm .github/workflows/ui-preview-bot-mobile-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine preview into mobile-first Vindhu heritage home'
          git push origin ui-preview
