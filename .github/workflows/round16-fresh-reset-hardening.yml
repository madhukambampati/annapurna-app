name: Round16 fresh reset hardening
on:
  push:
    branches: [round16-fresh-reset-hardening]
    paths:
      - '.github/workflows/round16-fresh-reset-hardening.yml'
permissions:
  contents: write
jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round16-fresh-reset-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python scripts/round16-patch.py
      - name: Verify intended changes
        run: |
          grep -q 'deterministicFreshDraft' src/agent.ts
          grep -q 'freshResetContext' src/agent.ts
          grep -q 'promptHistory.splice(0, promptHistory.length - 1)' src/agent.ts
          grep -q 'Claude timed out before replying' src/agent.ts
          grep -q 'fresh reset should not call Claude' test/agent.test.ts
      - name: Full regression suite
        run: npm test
      - name: Whitespace check
        run: git diff --check
      - name: Commit tested changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/round16-fresh-reset-hardening.yml scripts/round16-patch.py
          git add src/agent.ts test/agent.test.ts
          git commit -m "Harden fresh-order reset against model timeouts"
          git push origin HEAD:round16-fresh-reset-hardening
