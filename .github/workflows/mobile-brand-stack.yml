name: Fix compact mobile brand stack

on:
  push:
    branches: [annapurna-working]
    paths:
      - '.github/workflows/mobile-brand-stack.yml'

permissions:
  contents: write

jobs:
  tweak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annapurna-working
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply compact mobile header fix
        run: node .github/apply-mobile-header.cjs

      - name: Run regression tests
        run: npm test

      - name: Commit fix and clean temporary files
        run: |
          rm .github/workflows/mobile-brand-stack.yml
          rm .github/apply-mobile-header.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/mobile-brand-stack.yml .github/apply-mobile-header.cjs
          git commit -m "Fix compact mobile Vindhu header"
          git push origin annapurna-working
