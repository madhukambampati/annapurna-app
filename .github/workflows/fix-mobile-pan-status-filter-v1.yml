name: Fix mobile pan and order status filtering

on:
  push:
    branches: [annapurna-working]
    paths:
      - 'scripts/fix-mobile-pan-status-filter-v1.cjs'
      - '.github/workflows/fix-mobile-pan-status-filter-v1.yml'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annapurna-working
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply viewport and order filter fixes
        run: node scripts/fix-mobile-pan-status-filter-v1.cjs
      - name: Check browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Verify fix markers
        run: |
          grep -q 'viewportPanFixV1' public/index.html
          grep -q 'ownerViewportPanFixV1' public/desk.html
          grep -q 'Cancelled orders' public/desk.js
          grep -q 'status.addEventListener("change", apply)' public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit tested fixes and remove temporary runner
        shell: bash
        run: |
          rm scripts/fix-mobile-pan-status-filter-v1.cjs
          rm .github/workflows/fix-mobile-pan-status-filter-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile viewport drift and owner order filters"
          git push origin annapurna-working
