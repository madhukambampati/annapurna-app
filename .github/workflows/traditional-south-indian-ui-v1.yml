name: Traditional South Indian UI regression

on:
  push:
    branches: [traditional-south-indian-ui-v1]

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: traditional-south-indian-ui-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply traditional visual refresh
        run: node scripts/traditional-south-indian-ui-v1.cjs
      - name: Verify visual markers
        run: |
          grep -q 'traditionalSouthIndianV1' public/index.html
          grep -q 'heritage-signoff' public/index.html
          grep -q 'ownerTraditionalSouthIndianV1' public/desk.html
      - name: Check browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested refresh and remove temporary runner
        shell: bash
        run: |
          rm scripts/traditional-south-indian-ui-v1.cjs
          rm .github/workflows/traditional-south-indian-ui-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add South Indian heritage visual refresh'
          git push origin traditional-south-indian-ui-v1
