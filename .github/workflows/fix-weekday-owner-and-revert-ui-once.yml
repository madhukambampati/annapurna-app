name: One-time weekday owner approval and UI revert
on:
  push:
    branches: [main]
    paths:
      - '.github/fix-weekday-owner-trigger.txt'
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply owner-approval behavior and revert latest UI theme
        run: python .github/scripts/fix-weekday-owner-and-revert-ui.py
      - name: Verify scope and syntax
        run: |
          git diff --check
          node --check public/app.js
          node --check public/desk.js
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          echo "Changed: $changed"
          test "$changed" = "public/desk.html public/index.html src/prompt.ts test/agent.test.ts "
      - name: Full regression suite
        run: |
          npm ci
          npm test
      - name: Commit fixes
        run: |
          git config user.name 'madhukambampati'
          git config user.email '85366523+madhukambampati@users.noreply.github.com'
          git add public/index.html public/desk.html src/prompt.ts test/agent.test.ts
          git commit -m 'Route off-day combo pickups to owner approval and revert visual theme'
          git push origin HEAD:main
