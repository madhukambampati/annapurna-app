name: One-time UI polish v3
on:
  push:
    branches: [main]
    paths:
      - '.github/ui-polish-v3-trigger.txt'
permissions:
  contents: write
jobs:
  polish-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply presentation-only polish
        run: python .github/scripts/apply-ui-polish-v3.py
      - name: Scope checks
        run: |
          git diff --check
          node --check public/app.js
          node --check public/desk.js
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          echo "Changed: $changed"
          test "$changed" = "public/desk.html public/index.html "
      - name: Full regression suite
        run: |
          npm ci
          npm test
      - name: Commit visual polish
        run: |
          git config user.name 'madhukambampati'
          git config user.email '85366523+madhukambampati@users.noreply.github.com'
          git add public/index.html public/desk.html
          git commit -m 'Polish customer and owner UI presentation'
          git push origin HEAD:main
