name: Apply customer validation patch

on:
  push:
    branches: [annapurna-working]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annapurna-working

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply validation changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(path, oldText, newText) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(oldText)) {
              throw new Error(`Expected block not found in ${path}`);
            }
            text = text.replace(oldText, newText);
            fs.writeFileSync(path, text);
            console.log(`Updated ${path}`);
          }

          replaceOnce(
            'public/index.html',
            String.raw`.err{color:var(--chilli);font-size:14px;min-height:1.2em}
          .tiny{font-size:12.5px;color:var(--dim);margin:0}`,
            String.raw`.err{color:var(--chilli);font-size:14px;min-height:1.2em}
          .field-error{display:block;color:var(--chilli);font-size:12.5px;font-weight:600;line-height:1.35}
          input.field-invalid{border-color:var(--chilli)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--chilli) 16%,transparent)!important}
          .tiny{font-size:12.5px;color:var(--dim);margin:0}`
          );

          replaceOnce(
            'public/index.html',
            String.raw`      <label class="f">Your name<input type="text" id="fName" name="name" autocomplete="name" maxlength="60" required></label>
                <label class="f">Phone or email (so Annapurna Home Foods can reach you)<input type="text" id="fContact" name="contact" autocomplete="tel" inputmode="text" maxlength="80" required></label>`,
            String.raw`      <label class="f">Your name
                  <input type="text" id="fName" name="name" autocomplete="name" autocapitalize="words" maxlength="60" aria-describedby="fNameErr" required>
                  <span class="field-error" id="fNameErr" aria-live="polite"></span>
                </label>
                <label class="f">Phone or email (so Annapurna Home Foods can reach you)
                  <input type="text" id="fContact" name="contact" autocomplete="tel" inputmode="text" maxlength="80" aria-describedby="fContactErr" required>
                  <span class="field-error" id="fContactErr" aria-live="polite"></span>
                </label>`
          );

          replaceOnce(
            'public/app.js',
            String.raw`  function validNameInput(n) { return !!n && n.length <= 60 && !/[<>]/.test(n); }
            function validContactInput(c) {
              if (c.length < 5 || c.length > 80) return false;
              if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) return true;
              return /^[+()\-.\s\d]+$/.test(c) && c.replace(/\D/g, "").length >= 7;
            }`,
            String.raw`  function nameValidationError(value) {
              var name = String(value || "").trim();
              if (!name) return "Please enter your name.";
              if (name.length > 60) return "Name must be 60 characters or less.";
              if (!/^[\p{L}\p{M}][\p{L}\p{M} .'\u2019-]*$/u.test(name)) return "Please use letters only. Spaces, hyphens, apostrophes and periods are allowed.";
              return "";
            }
            function contactValidationError(value) {
              var contact = String(value || "").trim();
              if (!contact) return "Please enter a phone number or email.";
              if (contact.length > 80) return "Phone or email is too long.";
              if (contact.indexOf("@") !== -1) {
                if (!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,63}$/.test(contact)) return "Please enter a valid email, for example name@example.com.";
                return "";
              }
              if (!/^[+()\-. \d]+$/.test(contact)) return "Please enter a valid phone number or email.";
              var plusCount = (contact.match(/\+/g) || []).length;
              if (plusCount > 1 || (plusCount === 1 && contact.charAt(0) !== "+")) return "The + sign can only appear at the beginning of a phone number.";
              var digits = contact.replace(/\D/g, "");
              if (digits.length < 7 || digits.length > 15) return "Please enter a phone number with 7 to 15 digits.";
              return "";
            }
            function setFieldValidation(inputId, errorId, message) {
              var input = $(inputId), error = $(errorId);
              if (!input || !error) return;
              input.classList.toggle("field-invalid", !!message);
              input.setAttribute("aria-invalid", message ? "true" : "false");
              error.textContent = message || "";
            }`
          );

          replaceOnce(
            'public/app.js',
            String.raw`  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
          
            $("startForm").addEventListener("submit", function (e) {`,
            String.raw`  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
          
            $("fName").addEventListener("blur", function () {
              setFieldValidation("fName", "fNameErr", nameValidationError($("fName").value));
            });
            $("fContact").addEventListener("blur", function () {
              setFieldValidation("fContact", "fContactErr", contactValidationError($("fContact").value));
            });
            $("fName").addEventListener("input", function () {
              if ($("fName").getAttribute("aria-invalid") === "true") setFieldValidation("fName", "fNameErr", nameValidationError($("fName").value));
            });
            $("fContact").addEventListener("input", function () {
              if ($("fContact").getAttribute("aria-invalid") === "true") setFieldValidation("fContact", "fContactErr", contactValidationError($("fContact").value));
            });
          
            $("startForm").addEventListener("submit", function (e) {`
          );

          replaceOnce(
            'public/app.js',
            String.raw`    var name = $("fName").value.trim(), contact = $("fContact").value.trim();
              if (!name) { err.textContent = "Please enter your name."; return; }
              if (!validNameInput(name)) { err.textContent = "Please enter a name without < or > characters."; return; }
              if (!contact) { err.textContent = "Please enter a phone number or email."; return; }
              if (!validContactInput(contact)) { err.textContent = "Please enter a valid phone number or email."; return; }`,
            String.raw`    var name = $("fName").value.trim(), contact = $("fContact").value.trim();
              var nameError = nameValidationError(name), contactError = contactValidationError(contact);
              setFieldValidation("fName", "fNameErr", nameError);
              setFieldValidation("fContact", "fContactErr", contactError);
              if (nameError || contactError) {
                err.textContent = nameError && contactError ? "Please fix the highlighted fields." : "Please fix the highlighted field.";
                (nameError ? $("fName") : $("fContact")).focus();
                return;
              }`
          );

          replaceOnce(
            'src/server.ts',
            String.raw`/** A display name is plain text. HTML-like names are rejected for customer-facing polish. */
          export function validName(n: string): boolean {
            return n.length > 0 && n.length <= 60 && !/[<>]/.test(n);
          }
          
          /** A phone number (7+ digits) or something that looks like an email. */
          export function validContact(c: string): boolean {
            if (c.length < 5 || c.length > 80) return false;
            if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) return true;
            return /^[+()\-.\s\d]+$/.test(c) && c.replace(/\D/g, "").length >= 7;
          }`,
            String.raw`/** Customer display name: letters plus normal name punctuation only. */
          export function validName(n: string): boolean {
            const value = n.trim();
            return value.length > 0
              && value.length <= 60
              && /^[\p{L}\p{M}][\p{L}\p{M} .'\u2019-]*$/u.test(value);
          }
          
          /** A valid email or phone number containing 7-15 digits. */
          export function validContact(c: string): boolean {
            const value = c.trim();
            if (value.length < 5 || value.length > 80) return false;
            if (value.includes("@")) return /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,63}$/.test(value);
            if (!/^[+()\-. \d]+$/.test(value)) return false;
            const plusCount = (value.match(/\+/g) ?? []).length;
            if (plusCount > 1 || (plusCount === 1 && !value.startsWith("+"))) return false;
            const digits = value.replace(/\D/g, "");
            return digits.length >= 7 && digits.length <= 15;
          }`
          );

          replaceOnce(
            'test/web.test.ts',
            String.raw`  for (const bad of ["", "abc", "12345", "not an email@", "a@b", "<script>alert(1)</script>", "x".repeat(81)]) assert.equal(validContact(bad), false, bad);
            for (const ok of ["Asha", "M. Kiran", "Siva-Parvathi", "José"]) assert.equal(validName(ok), true, ok);
            for (const bad of ["", "<script>alert(1)</script>", "A < B", "x".repeat(61)]) assert.equal(validName(bad), false, bad);`,
            String.raw`  for (const bad of ["", "abc", "12345", "not an email@", "a@b", "519+5550101", "1234567890123456", "<script>alert(1)</script>", "x".repeat(81)]) assert.equal(validContact(bad), false, bad);
            for (const ok of ["Asha", "M. Kiran", "Siva-Parvathi", "José", "O'Connor"]) assert.equal(validName(ok), true, ok);
            for (const bad of ["", "1234", "M@xy", "Madhu_1", "<script>alert(1)</script>", "A < B", "x".repeat(61)]) assert.equal(validName(bad), false, bad);`
          );
          NODE

      - name: Run regression tests
        run: npm test

      - name: Commit validation changes
        shell: bash
        run: |
          rm -f .github/workflows/validation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/app.js src/server.ts test/web.test.ts .github/workflows/validation-patch.yml
          git commit -m "Add customer name and contact validation"
          git push origin annapurna-working
