name: UI preview heritage V5 regression
on:
  push:
    branches: [ui-preview]
    paths:
      - 'scripts/apply-heritage-v5.cjs'
      - '.github/workflows/ui-preview-heritage-v5.yml'
permissions:
  contents: write
jobs:
  patch-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply V5 visual redesign
        run: node scripts/apply-heritage-v5.cjs
      - name: Verify V5 visual assets and mobile lock
        run: |
          grep -q 'heritageVisualV5' public/index.html
          grep -q "heritage-hero-v5.svg" public/index.html
          grep -q "combos-v5.svg" public/index.html
          grep -q "weekly-plans-v5.svg" public/index.html
          grep -q "orders-v5.svg" public/index.html
          grep -q 'overflow-x:hidden!important' public/index.html
          test -f public/assets/heritage-hero-v5.svg
          test -f public/assets/combos-v5.svg
          test -f public/assets/weekly-plans-v5.svg
          test -f public/assets/orders-v5.svg
      - name: Browser JavaScript syntax
        run: node --check public/app.js && node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested preview and remove temporary runner
        run: |
          rm -f scripts/apply-heritage-v5.cjs .github/workflows/ui-preview-heritage-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html scripts/apply-heritage-v5.cjs .github/workflows/ui-preview-heritage-v5.yml
          git commit -m 'Build colorful Telugu-home bot preview V5'
          git push origin HEAD:ui-preview
