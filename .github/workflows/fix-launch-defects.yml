name: Fix launch defects

on:
  push:
    branches: [annapurna-working]
    paths: ['.github/workflows/fix-launch-defects.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annapurna-working
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply R8 R6b R3 R7 R9 fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOne(path, oldText, newText) {
            let s = fs.readFileSync(path, 'utf8');
            if (!s.includes(oldText)) throw new Error(`Anchor not found in ${path}: ${oldText.slice(0, 90)}`);
            s = s.replace(oldText, newText);
            fs.writeFileSync(path, s);
          }

          replaceOne(
            'public/app.js',
            `  $("fName").addEventListener("input", function () {\n    if ($("fName").getAttribute("aria-invalid") === "true") setFieldValidation("fName", "fNameErr", nameValidationError($("fName").value));\n  });\n  $("fContact").addEventListener("input", function () {\n    if ($("fContact").getAttribute("aria-invalid") === "true") setFieldValidation("fContact", "fContactErr", contactValidationError($("fContact").value));\n  });`,
            `  function clearResolvedStartError() {\n    var err = $("startErr");\n    if (!err || !/^Please fix the highlighted field/.test(err.textContent || "")) return;\n    if (!nameValidationError($("fName").value) && !contactValidationError($("fContact").value)) err.textContent = "";\n  }\n  $("fName").addEventListener("input", function () {\n    if ($("fName").getAttribute("aria-invalid") === "true") setFieldValidation("fName", "fNameErr", nameValidationError($("fName").value));\n    clearResolvedStartError();\n  });\n  $("fContact").addEventListener("input", function () {\n    if ($("fContact").getAttribute("aria-invalid") === "true") setFieldValidation("fContact", "fContactErr", contactValidationError($("fContact").value));\n    clearResolvedStartError();\n  });`
          );

          replaceOne(
            'src/server.ts',
            `            id: o.id, status: o.status, pickup: o.pickup, pickupText: formatWhen(o.pickup), items: o.items.map(itemLabel), total: total(o.items), address: s.address,`,
            `            id: o.id, status: o.status, pickup: o.pickup, pickupText: formatWhen(o.pickup), items: o.items.map(itemLabel), total: total(o.items), notes: o.notes, address: s.address,`
          );
          replaceOne(
            'public/app.js',
            `        h("div", { class: "ord-meta" },\n          h("div", {}, h("span", {}, "Pickup"), h("b", {}, o.pickupText)),\n          (o.status === "ready" || o.status === "cook") && o.address ? h("div", {}, h("span", {}, "Location"), h("b", {}, o.address)) : null),`,
            `        h("div", { class: "ord-meta" },\n          h("div", {}, h("span", {}, "Pickup"), h("b", {}, o.pickupText)),\n          o.notes ? h("div", {}, h("span", {}, "Note"), h("b", {}, o.notes)) : null,\n          (o.status === "ready" || o.status === "cook") && o.address ? h("div", {}, h("span", {}, "Location"), h("b", {}, o.address)) : null),`
          );

          replaceOne(
            'public/desk.js',
            `.filter((o) => o.status !== "cancelled" && Number(o.createdAt || 0) >= launchAt && localDateKey(o.createdAt, tz) === today)`,
            `.filter((o) => !["hold", "cancelled"].includes(o.status) && Number(o.createdAt || 0) >= launchAt && localDateKey(o.createdAt, tz) === today)`
          );

          replaceOne(
            'src/store.ts',
            `    // Non-order alerts depend on chat context. Once the customer deletes the chat they must not\n    // remain as orphaned "Open chat" tasks for the owner. Order-linked alerts stay for kitchen safety.\n    this.db.prepare("UPDATE alerts SET done = 1 WHERE wa_id = ? AND order_id IS NULL").run(waId);`,
            `    // Chat-only work and cancellation requests should not survive a deleted customer chat.\n    // Other order-linked safety alerts remain available to the kitchen.\n    this.db.prepare("UPDATE alerts SET done = 1 WHERE wa_id = ? AND (order_id IS NULL OR note LIKE 'Cancellation requested%')").run(waId);`
          );
          replaceOne(
            'src/store.ts',
            `  /** The owner has replied in the chat, so open handoff requests from this customer are answered. */\n  closeHandoffs(waId: string): void {\n    this.db.prepare("UPDATE alerts SET done = 1 WHERE wa_id = ? AND done = 0 AND note LIKE 'Wants to talk to a person%'").run(waId);\n  }\n\n  markAlertDone(id: number): void {`,
            `  /** The owner has replied in the chat, so open handoff requests from this customer are answered. */\n  closeHandoffs(waId: string): void {\n    this.db.prepare("UPDATE alerts SET done = 1 WHERE wa_id = ? AND done = 0 AND note LIKE 'Wants to talk to a person%'").run(waId);\n  }\n\n  /** A closed order cannot keep stale owner alerts open. */\n  closeOrderAlerts(orderId: number): void {\n    this.db.prepare("UPDATE alerts SET done = 1 WHERE order_id = ? AND done = 0").run(orderId);\n  }\n\n  markAlertDone(id: number): void {`
          );
          replaceOne(
            'src/server.ts',
            `          const updated = store.setOrderStatus(o.id, to, o.status === "hold" && to === "cook");\n          const s = store.getSettings();`,
            `          const updated = store.setOrderStatus(o.id, to, o.status === "hold" && to === "cook");\n          if (to === "cancelled" || to === "done") store.closeOrderAlerts(o.id);\n          const s = store.getSettings();`
          );

          {
            const path = 'public/index.html';
            let s = fs.readFileSync(path, 'utf8');
            const marker = '</style>';
            const guard = `\n/* 320px launch guard: preserve Annapurna + nav; Vindhu remains visible in the chat heading. */\n@media(max-width:340px){\n  .customer-mode .top{gap:4px;padding-left:6px;padding-right:6px}\n  .customer-mode .seal{width:34px;height:34px;border-radius:11px}\n  .customer-mode .brand{max-width:78px}\n  .customer-mode .brand h1{font-size:14px!important;line-height:1.02}\n  .customer-mode .brand small{display:block!important;font-size:7.8px!important;line-height:1.05;white-space:nowrap!important}\n  .customer-mode .brand small::after{display:none!important}\n  .customer-mode .tabs{gap:0}\n  .customer-mode .tab{min-width:41px!important;padding-left:2px!important;padding-right:2px!important;font-size:9.5px!important}\n}\n`;
            if (!s.includes('320px launch guard: preserve Annapurna + nav')) {
              if (!s.includes(marker)) throw new Error('style marker not found');
              s = s.replace(marker, guard + marker);
              fs.writeFileSync(path, s);
            }
          }

          replaceOne(
            'test/web.test.ts',
            `      t.llm.push(modelReply({ reply: "Sure, noted.", items: [{ id: "kheema_fry", qty: 2, pack: "bogo", asked_for: "kheema fry" }], pickup: FRI_6PM, stage: "awaiting_confirmation" }));`,
            `      t.llm.push(modelReply({ reply: "Sure, noted.", items: [{ id: "kheema_fry", qty: 2, pack: "bogo", asked_for: "kheema fry" }], pickup: FRI_6PM, notes: "Spicy", stage: "awaiting_confirmation" }));`
          );
          replaceOne(
            'test/web.test.ts',
            `      assert.deepEqual([o.json.orders[0].status, o.json.orders[0].total], ["cook", 56]);\n      assert.match(o.json.orders[0].pickupText, /Fri/);`,
            `      assert.deepEqual([o.json.orders[0].status, o.json.orders[0].total], ["cook", 56]);\n      assert.equal(o.json.orders[0].notes, "Spicy");\n      assert.match(o.json.orders[0].pickupText, /Fri/);`
          );
          replaceOne(
            'test/web.test.ts',
            `      assert.match(alert!.note, /Cancellation requested/);\n      assert.ok(r.json.messages.some((m: any) => /cancellation request/i.test(m.text)));\n      assert.match(t.notifier.sent.at(-1)!.title, /Cancellation request/);`,
            `      assert.match(alert!.note, /Cancellation requested/);\n      assert.ok(r.json.messages.some((m: any) => /cancellation request/i.test(m.text)));\n      assert.match(t.notifier.sent.at(-1)!.title, /Cancellation request/);\n      const cancelled = await call("POST", "/api/orders/" + id + "/status", { token: "secret", body: { status: "cancelled" } });\n      assert.equal(cancelled.status, 200);\n      assert.equal(t.store.listAlerts(true).some((a) => a.orderId === id), false);`
          );
          replaceOne(
            'test/web.test.ts',
            `      t.store.insertAlert({ waId: wa, cust: "Asha", note: "Custom/bulk request: old pending request", orderId: null, createdAt: Date.now() });\n      assert.ok(t.store.listAlerts(true).some((a) => a.waId === wa && a.orderId == null));\n      assert.equal((await call("DELETE", "/web/me", { token })).status, 200);\n      assert.equal(t.store.getMessages(wa, 50).length, 0);\n      assert.equal(t.store.listAlerts(true).some((a) => a.waId === wa && a.orderId == null), false);`,
            `      t.store.insertAlert({ waId: wa, cust: "Asha", note: "Custom/bulk request: old pending request", orderId: null, createdAt: Date.now() });\n      const placedOrder = t.store.listOrders()[0]!;\n      t.store.insertAlert({ waId: wa, cust: "Asha", note: "Cancellation requested for order #" + placedOrder.id, orderId: placedOrder.id, createdAt: Date.now() });\n      assert.ok(t.store.listAlerts(true).some((a) => a.waId === wa && a.orderId == null));\n      assert.ok(t.store.listAlerts(true).some((a) => a.waId === wa && a.note.startsWith("Cancellation requested")));\n      assert.equal((await call("DELETE", "/web/me", { token })).status, 200);\n      assert.equal(t.store.getMessages(wa, 50).length, 0);\n      assert.equal(t.store.listAlerts(true).some((a) => a.waId === wa && a.orderId == null), false);\n      assert.equal(t.store.listAlerts(true).some((a) => a.waId === wa && a.note.startsWith("Cancellation requested")), false);`
          );
          NODE

      - name: Run regression tests
        run: npm test

      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-launch-defects.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/desk.js public/index.html src/server.ts src/store.ts test/web.test.ts .github/workflows/fix-launch-defects.yml
          git commit -m "Fix pre-launch customer and owner defects"
          git push origin annapurna-working
