name: One-time customer South Indian polish

on:
  push:
    branches: [customer-south-indian-polish-v1]

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.message == 'Run customer South Indian polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply customer presentation polish
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('public/index.html')
          source = Path('.github/ui/customer-south-indian-v1.css')
          marker = 'customerSouthIndianPolishV1'
          s = target.read_text()
          if marker in s:
              raise SystemExit('customer polish already applied')
          css = source.read_text()
          block = f'\n<style id="{marker}">\n{css}\n</style>\n'
          if '</head>' not in s:
              raise SystemExit('public/index.html: missing </head>')
          target.write_text(s.replace('</head>', block + '</head>', 1))
          PY
      - name: Verify presentation-only scope
        run: |
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          test "$changed" = "public/index.html "
          grep -q 'customerSouthIndianPolishV1' public/index.html
          git diff --check
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: |
          npm ci
          npm test
      - name: Commit customer UI polish
        run: |
          git config user.name 'madhukambampati'
          git config user.email '85366523+madhukambampati@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Polish customer UI with South Indian visual identity'
          git push origin HEAD:customer-south-indian-polish-v1
