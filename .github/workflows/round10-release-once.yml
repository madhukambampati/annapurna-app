name: Round 10 release once

on:
  push:
    branches:
      - release-round10-vindhu

permissions:
  contents: write

jobs:
  prepare-release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-round10-vindhu
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Restore exact tested Vindhu UI
        run: |
          git fetch origin ui-redesign-v1
          git checkout origin/ui-redesign-v1 -- public/index.html public/app.js public/desk.html public/desk.js
      - name: Apply final launch tweaks
        run: |
          python3 .github/round10-release-patch.py
      - name: Install
        run: npm ci
      - name: Browser syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Validate release diff
        run: |
          git diff --check
          grep -Fq 'Hi! I’m Vindhu, your Annapurna ordering assistant 🍛' public/app.js
          grep -Fq 'owner_chat_reset_vindhu_20260927' src/store.ts
          grep -Fq 'ownerChatResetAfterMessageId' src/server.ts
          git diff --name-only
      - name: Commit tested release
        run: |
          git add public/index.html public/app.js public/desk.html public/desk.js src/store.ts src/server.ts
          git commit -m 'Prepare Round 10 Vindhu release'
          git push origin HEAD:release-round10-vindhu
