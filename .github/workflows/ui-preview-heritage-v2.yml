name: UI preview heritage bot regression

on:
  push:
    branches: [ui-preview]
    paths:
      - 'scripts/ui-preview-heritage-v2.cjs'
      - '.github/workflows/ui-preview-heritage-v2.yml'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply preview visual refresh
        run: node scripts/ui-preview-heritage-v2.cjs
      - name: Verify preview markers
        run: |
          grep -q 'heritageBotPreviewV2' public/index.html
          grep -q 'heritage-signoff' public/index.html
          grep -q 'ownerHeritagePreviewV2' public/desk.html
      - name: Check browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested preview and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ui-preview-heritage-v2.cjs
          rm .github/workflows/ui-preview-heritage-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add bot-first South Indian heritage preview'
          git push origin ui-preview
