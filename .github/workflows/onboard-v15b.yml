name: Onboard V15B
on:
  push:
    branches:
      - ui-preview
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/update-onboard-v15.py
      - run: grep -q "vindhu_hero_with_food.png?v=15" public/heritage-v11.css
      - run: npm test
      - run: git diff --check
      - name: Commit tested V15B
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/onboard-v15b.yml scripts/update-onboard-v15.py
          git add public/heritage-v11.css
          git commit -m "Use supplied South Indian hero before login V15"
          git push origin HEAD:ui-preview
