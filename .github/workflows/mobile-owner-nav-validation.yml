name: Mobile owner nav validation
on:
  push:
    branches: [fix-mobile-owner-nav-overlap]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: git diff --check annapurna-working...HEAD || true
      - name: Validate mobile-nav CSS markers
        run: |
          grep -q 'ownerMobileNavNoOverlapV2' public/desk.html
          grep -q 'height:100dvh!important' public/desk.html
          grep -q 'position:relative!important' public/desk.html
