name: Prelaunch contact hardening

on:
  push:
    branches:
      - annapurna-working
    paths:
      - .github/workflows/prelaunch-contact-hardening.yml

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annapurna-working
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply validated contact patch
        run: node scripts/prelaunch-contact-hardening.cjs
      - name: Full regression suite
        run: npm test
      - name: Commit fix and remove temporary patch files
        shell: bash
        run: |
          rm scripts/prelaunch-contact-hardening.cjs
          rm .github/workflows/prelaunch-contact-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js src/server.ts test scripts/prelaunch-contact-hardening.cjs .github/workflows/prelaunch-contact-hardening.yml
          git commit -m "Finalize prelaunch contact validation"
          git push origin annapurna-working
