name: UI preview V7 repair
on:
  push:
    branches: [ui-preview]
    paths:
      - '.github/workflows/ui-preview-v7-repair.yml'
permissions:
  contents: write
jobs:
  repair-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install V7 visual assets and repair layout
        shell: bash
        run: |
          cat > /tmp/hero.b64 <<'EOF_HERO'
…1264 chars truncated…EOF_HERO
          cat > /tmp/combo.b64 <<'EOF_COMBO'

EOF_COMBO
          cat > /tmp/plans.b64 <<'EOF_PLANS'

EOF_PLANS
          base64 -d /tmp/hero.b64 > public/assets/hero-v7.jpg
          base64 -d /tmp/combo.b64 > public/assets/combo-v7.jpg
          base64 -d /tmp/plans.b64 > public/assets/plans-v7.jpg
          python - <<'PY'
from pathlib import Path
p=Path('public/index.html')
s=p.read_text()
if 'home-photo-v7' not in s:
    s=s.replace('<div class="home-annuwrap" aria-hidden="true">','<div class="home-annuwrap" aria-hidden="true">\n        <img class="home-photo-v7" src="/assets/hero-v7.jpg" alt="" decoding="async" fetchpriority="high">',1)
if 'session-photo-v7' not in s:
    s=s.replace('<main class="onboard" id="onboard" hidden>\n    <section class="hero">','<main class="onboard" id="onboard" hidden>\n    <section class="hero">\n      <img class="session-photo-v7" src="/assets/hero-v7.jpg" alt="" decoding="async">',1)
p.write_text(s)
PY
          cat >> public/heritage-v6.css <<'EOF_CSS'

/* V7 repair — fixes hidden-state leakage, iPhone scrolling and makes the approved visual art explicit. */
body.customer-mode #home[hidden],
body.customer-mode #onboard[hidden],
body.customer-mode #chat[hidden],
body.customer-mode .customer-home[hidden],
body.customer-mode .onboard[hidden],
body.customer-mode .chat[hidden]{display:none!important}

body.customer-mode #onboard #bubble,
body.customer-mode #onboard .bubble{
  color:#173d2e!important;
  -webkit-text-fill-color:#173d2e!important;
  opacity:1!important;
  text-shadow:none!important;
}

body.customer-mode .home-annuwrap{
  display:block!important;
  position:relative!important;
  visibility:visible!important;
  opacity:1!important;
  background:none!important;
  overflow:hidden!important;
}
body.customer-mode .home-photo-v7{
  position:absolute!important;
  inset:0!important;
  display:block!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  object-position:center!important;
  opacity:1!important;
}
body.customer-mode .home-annuwrap .home-motion-stage,
body.customer-mode .home-annuwrap>.home-bubble{display:none!important}

body.customer-mode .tile-combo::before{background-image:url('/assets/combo-v7.jpg')!important}
body.customer-mode .tile-plan::before{background-image:url('/assets/plans-v7.jpg')!important}
body.customer-mode .tile-combo::before,
body.customer-mode .tile-plan::before{background-size:cover!important;background-position:center!important}

body.customer-mode .onboard .hero{background:#0b563b!important;isolation:isolate!important}
body.customer-mode .onboard .session-photo-v7{
  position:absolute!important;
  top:0!important;right:0!important;bottom:0!important;
  width:58%!important;height:100%!important;
  object-fit:cover!important;object-position:center!important;
  z-index:1!important;opacity:1!important;
}
body.customer-mode .onboard .hero::after{
  content:""!important;
  position:absolute!important;
  inset:0!important;
  z-index:2!important;
  border:0!important;
  border-radius:inherit!important;
  background:linear-gradient(90deg,#0b563b 0%,#0b563b 39%,rgba(11,86,59,.92) 48%,rgba(11,86,59,.46) 62%,rgba(11,86,59,.08) 77%,transparent 100%)!important;
  pointer-events:none!important;
}
body.customer-mode .onboard .hero::before{z-index:5!important}
body.customer-mode .onboard .heroTop,
body.customer-mode .onboard .kick,
body.customer-mode .onboard .hero h2,
body.customer-mode .onboard .hero>p{z-index:6!important}

/* Home/onboarding are normal scrolling pages. Chat switches back to the app viewport. */
body.customer-mode .app{width:100%!important;max-width:100%!important;min-width:0!important}
body.customer-mode:has(#home:not([hidden])) .app,
body.customer-mode:has(#onboard:not([hidden])) .app{
  height:auto!important;
  min-height:100dvh!important;
  overflow:visible!important;
}
body.customer-mode:has(#chat:not([hidden])) .app{
  height:100dvh!important;
  min-height:0!important;
  overflow:hidden!important;
}
body.customer-mode:has(#home:not([hidden])),
body.customer-mode:has(#onboard:not([hidden])){
  overflow-y:auto!important;
  overflow-x:hidden!important;
}
body.customer-mode .customer-home,
body.customer-mode .onboard{min-width:0!important;width:100%!important}

@media(min-width:760px){
  body.customer-mode:has(#home:not([hidden])) .app,
  body.customer-mode:has(#onboard:not([hidden])) .app{
    max-width:1280px!important;
    height:auto!important;
    min-height:calc(100dvh - 40px)!important;
  }
  body.customer-mode .home-hero{
    display:grid!important;
    grid-template-columns:minmax(430px,.9fr) minmax(520px,1.1fr)!important;
    min-height:510px!important;
    padding:62px 0 0!important;
  }
  body.customer-mode .home-copy{
    min-width:0!important;
    padding:34px 30px 34px 72px!important;
    align-self:stretch!important;
    justify-content:center!important;
  }
  body.customer-mode .home-annuwrap{
    min-height:448px!important;
    align-self:stretch!important;
  }
  body.customer-mode .home-copy h2{font-size:clamp(48px,4.5vw,66px)!important;line-height:.98!important}
  body.customer-mode .home-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  body.customer-mode .onboard{overflow:visible!important}
  body.customer-mode .onboard .hero{min-height:430px!important}
}

@media(max-width:759px){
  html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
  body.customer-mode{padding:0!important}
  body.customer-mode .app{border-radius:0!important;box-shadow:none!important;border:0!important}
  body.customer-mode .top{position:relative!important;width:100%!important;max-width:100%!important;overflow:hidden!important}

  body.customer-mode .customer-home{overflow:visible!important;flex:none!important;padding-bottom:calc(22px + env(safe-area-inset-bottom))!important}
  body.customer-mode .home-hero{
    display:flex!important;
    flex-direction:column!important;
    min-height:0!important;
    padding:44px 12px 14px!important;
    overflow:hidden!important;
  }
  body.customer-mode .home-annuwrap{
    order:1!important;
    min-height:235px!important;
    width:100%!important;
    margin:0!important;
    border-radius:20px!important;
    border:1px solid #d8b25b!important;
  }
  body.customer-mode .home-copy{
    order:2!important;
    width:100%!important;
    padding:18px 6px 4px!important;
    text-align:left!important;
  }
  body.customer-mode .home-copy h2{font-size:36px!important;line-height:1.01!important;margin:8px 0 10px!important}
  body.customer-mode .home-copy>p{font-size:14px!important;line-height:1.45!important}
  body.customer-mode .home-hero-actions{display:grid!important;grid-template-columns:1fr!important;gap:9px!important;margin-top:15px!important}
  body.customer-mode .home-primary,
  body.customer-mode .home-secondary{width:100%!important;min-height:54px!important}
  body.customer-mode .home-section{padding:11px 10px 0!important}
  body.customer-mode .home-grid{grid-template-columns:1fr!important;gap:10px!important}
  body.customer-mode .home-tile{min-height:190px!important;padding:118px 14px 14px!important;border-radius:19px!important}
  body.customer-mode .home-tile::before{height:112px!important}
  body.customer-mode .home-tile::after{top:88px!important;height:28px!important}
  body.customer-mode .heritage-signoff{margin:11px 10px 0!important}
  body.customer-mode .home-promise{margin:10px!important;grid-template-columns:1fr 1fr!important}

  body.customer-mode .onboard{
    display:flex!important;
    flex-direction:column!important;
    overflow:visible!important;
    padding:10px 10px calc(22px + env(safe-area-inset-bottom))!important;
    gap:10px!important;
  }
  body.customer-mode .onboard[hidden]{display:none!important}
  body.customer-mode .onboard .hero{
    min-height:520px!important;
    padding:315px 18px 22px!important;
    border-radius:24px!important;
    overflow:hidden!important;
  }
  body.customer-mode .onboard .session-photo-v7{
    top:0!important;left:0!important;right:0!important;bottom:auto!important;
    width:100%!important;height:300px!important;
    object-fit:cover!important;object-position:center!important;
  }
  body.customer-mode .onboard .hero::after{
    background:linear-gradient(0deg,#0b563b 0%,#0b563b 40%,rgba(11,86,59,.83) 54%,rgba(11,86,59,.12) 72%,transparent 100%)!important;
  }
  body.customer-mode .onboard .heroTop{
    left:16px!important;right:16px!important;top:226px!important;width:auto!important;
    justify-content:center!important;gap:8px!important;
  }
  body.customer-mode .onboard .mascotBtn{width:64px!important;height:64px!important;border-radius:19px!important}
  body.customer-mode .onboard .mascotBtn .mascot{width:60px!important}
  body.customer-mode .onboard .bubble{max-width:220px!important;font-size:12px!important;text-align:left!important;background:#fffaf0!important}
  body.customer-mode .onboard .kick{display:flex!important;width:max-content!important;max-width:100%!important;margin:0 auto!important;font-size:10px!important}
  body.customer-mode .onboard .hero h2{font-size:31px!important;line-height:1.02!important;text-align:center!important;margin:11px 0 8px!important}
  body.customer-mode .onboard .hero>p{font-size:13px!important;text-align:center!important;line-height:1.45!important}
  body.customer-mode .steps{grid-template-columns:1fr!important;gap:8px!important}
  body.customer-mode .steps li{display:grid!important;grid-template-columns:30px 1fr!important;column-gap:9px!important;align-items:center!important;padding:10px 12px!important}
  body.customer-mode .steps li b{grid-row:1/3!important;margin:0!important}
  body.customer-mode #startForm{position:relative!important;top:auto!important;padding:16px!important;border-radius:21px!important}
  body.customer-mode #startForm::before{font-size:22px!important}
}

@media(max-width:380px){
  body.customer-mode .home-copy h2{font-size:32px!important}
  body.customer-mode .home-promise{grid-template-columns:1fr!important}
  body.customer-mode .onboard .hero{min-height:500px!important;padding-top:300px!important}
  body.customer-mode .onboard .session-photo-v7{height:286px!important}
}
EOF_CSS
      - name: Verify V7 repair
        run: |
          test -s public/assets/hero-v7.jpg
          test -s public/assets/combo-v7.jpg
          test -s public/assets/plans-v7.jpg
          grep -q 'home-photo-v7' public/index.html
          grep -q 'session-photo-v7' public/index.html
          grep -q 'V7 repair' public/heritage-v6.css
          grep -q '#onboard\[hidden\]' public/heritage-v6.css
      - name: Browser JavaScript syntax
        run: node --check public/app.js && node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested V7 preview and remove temporary runner
        run: |
          rm -f .github/workflows/ui-preview-v7-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/heritage-v6.css public/assets/hero-v7.jpg public/assets/combo-v7.jpg public/assets/plans-v7.jpg .github/workflows/ui-preview-v7-repair.yml
          git commit -m 'Repair preview layout and mobile behavior V7'
          git push origin HEAD:ui-preview
