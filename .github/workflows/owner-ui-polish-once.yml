name: One-time owner UI polish
on:
  push:
    branches: [owner-ui-polish-v2]
    paths:
      - '.github/owner-ui-polish-trigger.txt'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply owner presentation polish
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('public/desk.html')
          source = Path('.github/ui/owner-polish-v2.css')
          marker = 'ownerPolishV2'
          s = target.read_text()
          if marker in s:
              raise SystemExit('owner polish already applied')
          css = source.read_text()
          block = f'\n<style id="{marker}">\n{css}\n</style>\n'
          if '</head>' not in s:
              raise SystemExit('public/desk.html: missing </head>')
          target.write_text(s.replace('</head>', block + '</head>', 1))
          PY
      - name: Verify presentation-only scope
        run: |
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          test "$changed" = "public/desk.html "
          grep -q 'ownerPolishV2' public/desk.html
          git diff --check
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: |
          npm ci
          npm test
      - name: Commit owner UI polish
        run: |
          git config user.name 'madhukambampati'
          git config user.email '85366523+madhukambampati@users.noreply.github.com'
          git add public/desk.html
          git commit -m 'Polish owner UI and separate mobile navigation'
          git push origin HEAD:owner-ui-polish-v2
