name: UI preview V6 regression
on:
  push:
    branches: [ui-preview]
    paths:
      - 'public/heritage-v6.css'
      - 'scripts/enable-heritage-v6.cjs'
      - '.github/workflows/ui-preview-v6.yml'
permissions:
  contents: write
jobs:
  patch-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Enable V6 stylesheet
        run: node scripts/enable-heritage-v6.cjs
      - name: Verify V6 preview wiring
        run: |
          grep -q 'heritage-v6.css?v=6' public/index.html
          grep -q 'home-annuwrap' public/heritage-v6.css
          grep -q 'overflow-x:hidden' public/heritage-v6.css
          grep -q 'combos-v5.svg?v=6' public/heritage-v6.css
          grep -q 'weekly-plans-v5.svg?v=6' public/heritage-v6.css
          grep -q 'orders-v5.svg?v=6' public/heritage-v6.css
      - name: Browser JavaScript syntax
        run: node --check public/app.js && node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested preview and remove temporary runner
        run: |
          rm -f scripts/enable-heritage-v6.cjs .github/workflows/ui-preview-v6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/heritage-v6.css scripts/enable-heritage-v6.cjs .github/workflows/ui-preview-v6.yml
          git commit -m 'Match preview to full South Indian reference V6'
          git push origin HEAD:ui-preview
