name: One-time Round 8 custom reset hotfix

on:
  push:
    branches: [ui-redesign-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run Round 8 custom reset hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Round 8 patch
        run: python3 .github/round8_patch.py
      - run: npm ci
      - name: Syntax check browser JavaScript
        run: |
          node --check public/app.js
          node --check public/desk.js
      - run: git diff --check
      - run: npm test
      - name: Commit tested Round 8 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent.ts src/server.ts src/store.ts public/desk.js test/web.test.ts
          git commit -m "Fix custom reset contamination and owner chat stale state"
          git push origin HEAD:ui-redesign-v1
