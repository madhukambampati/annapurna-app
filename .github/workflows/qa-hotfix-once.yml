name: One-time QA hotfix

on:
  push:
    branches: [ui-redesign-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run QA hotfix automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact QA hotfix
        env:
          HOTFIX_B64: 
        run: |
          python3 - <<'PY'
          import os, base64, gzip
          from pathlib import Path
          Path('/tmp/apply_qa_hotfix.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['HOTFIX_B64'])))
          PY
          python3 /tmp/apply_qa_hotfix.py
      - run: npm ci
      - run: git diff --check
      - run: npm test
      - name: Commit tested hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html public/desk.js src/server.ts src/agent.ts test
          git commit -m "Fix QA-reported customer flow bugs"
          git push origin HEAD:ui-redesign-v1
