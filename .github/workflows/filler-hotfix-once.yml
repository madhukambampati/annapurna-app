name: One-time filler hotfix

on:
  push:
    branches: [ui-redesign-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run filler hotfix automation'
    runs-on: ubuntu-latest
    env:
      HOTFIX_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply filler-message hotfix
        run: |
          python3 - <<'PY'
          import os, base64, gzip
          from pathlib import Path
          Path('/tmp/apply_filler_hotfix.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['HOTFIX_B64'])))
          PY
          python3 /tmp/apply_filler_hotfix.py
      - run: npm ci
      - run: git diff --check
      - run: npm test
      - name: Commit tested hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js src/server.ts test/web.test.ts
          git commit -m "Block stray owner filler messages"
          git push origin HEAD:ui-redesign-v1
