name: Apply reference home V11
on:
  push:
    branches: [ui-preview]
    paths:
      - '.github/workflows/apply-reference-home-v11.yml'
permissions:
  contents: write
jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply V11 wiring
        run: node scripts/apply-reference-home-v11.cjs
      - name: Verify V11 files and server mappings
        run: |
          grep -q 'heritage-v11.css?v=11' public/index.html
          grep -q '"/heritage-v11.css"' src/server.ts
          grep -q '"/assets/home-reference-v11.svg"' src/server.ts
          test -f public/heritage-v11.css
          test -f public/assets/home-reference-v11.svg
          test -f public/assets/combos-reference-v11.svg
          test -f public/assets/weekly-reference-v11.svg
          test -f public/assets/orders-reference-v11.svg
      - name: Browser JavaScript syntax
        run: node --check public/app.js
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested V11 and remove temporary runner
        run: |
          rm -f scripts/apply-reference-home-v11.cjs .github/workflows/apply-reference-home-v11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Match signed-in home to South Indian reference V11'
          git push origin HEAD:ui-preview
