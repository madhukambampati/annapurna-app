name: One-time Round 7 custom state hotfix

on:
  push:
    branches: [ui-redesign-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run Round 7 custom state hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 .github/custom_state_round7_patch.py
      - run: npm ci
      - name: Syntax check browser JavaScript
        run: |
          node --check public/app.js
          node --check public/desk.js
      - run: git diff --check
      - run: npm test
      - name: Commit tested Round 7 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/custom.ts src/agent.ts src/server.ts test/web.test.ts
          git commit -m "Prevent stale custom orders from contaminating normal orders"
          git push origin HEAD:ui-redesign-v1
