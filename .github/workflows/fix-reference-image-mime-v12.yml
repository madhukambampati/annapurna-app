name: Fix exact reference image serving V12
on:
  push:
    branches: [ui-preview]
    paths:
      - '.github/workflows/fix-reference-image-mime-v12.yml'
permissions:
  contents: write
jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact image MIME fix
        run: node scripts/fix-reference-image-mime-v12.cjs
      - name: Verify image routes
        run: |
          grep -q '"/assets/home-reference-v11.svg".*"image/webp"' src/server.ts
          grep -q '"/assets/combos-reference-v11.svg".*"image/webp"' src/server.ts
          grep -q '"/assets/weekly-reference-v11.svg".*"image/webp"' src/server.ts
          grep -q '"/assets/orders-reference-v11.svg".*"image/webp"' src/server.ts
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested V12 and remove temporary runner
        run: |
          rm -f scripts/fix-reference-image-mime-v12.cjs .github/workflows/fix-reference-image-mime-v12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Serve exact South Indian reference imagery V12'
          git push origin HEAD:ui-preview
