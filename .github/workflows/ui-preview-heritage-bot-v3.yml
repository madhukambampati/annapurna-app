name: UI preview heritage bot V3 regression
on:
  push:
    branches: [ui-preview]
    paths:
      - 'scripts/ui-preview-heritage-bot-v3.cjs'
      - '.github/workflows/ui-preview-heritage-bot-v3.yml'
permissions:
  contents: write
jobs:
  patch-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply structural preview redesign
        run: node scripts/ui-preview-heritage-bot-v3.cjs
      - name: Verify visual markers and viewport lock
        run: |
          grep -q 'customerHeritageBotV3' public/index.html
          grep -q 'ownerHeritageBotV3' public/desk.html
          grep -q 'overflow-x:hidden!important' public/index.html
          grep -q 'grid-template-areas:"eyebrow" "title" "intro" "mascot" "actions"' public/index.html
      - name: Browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested preview and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ui-preview-heritage-bot-v3.cjs
          rm .github/workflows/ui-preview-heritage-bot-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild preview as bot-first South Indian heritage experience'
          git push origin ui-preview
