name: UI preview V9 apply
on:
  push:
    branches:
      - ui-preview
    paths:
      - '.github/workflows/ui-preview-v9-apply.yml'
permissions:
  contents: write
jobs:
  apply-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply V9 customer UI patch
        run: node scripts/apply-ui-preview-v9.cjs
      - name: Verify V9 wiring
        run: |
          grep -q '/heritage-v9.css?v=9' public/index.html
          grep -q 'document.body.setAttribute("data-screen", which);' public/app.js
          grep -q "combos-v5.svg?v=9" public/heritage-v9.css
          grep -q "weekly-plans-v5.svg?v=9" public/heritage-v9.css
          grep -q "orders-v5.svg?v=9" public/heritage-v9.css
          grep -q '#onboard #bubble' public/heritage-v9.css
      - name: Browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested V9 preview and remove temporary runner
        run: |
          rm -f .github/workflows/ui-preview-v9-apply.yml scripts/apply-ui-preview-v9.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix customer screen isolation and reference layout V9'
          git push origin HEAD:ui-preview
