name: Fix delete chat mobile label

on:
  push:
    branches: [annapurna-working]
    paths: ['.github/workflows/fix-delete-chat-label.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annapurna-working
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Shorten destructive confirmation label
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'public/app.js';
          let s = fs.readFileSync(p, 'utf8');
          const old = '"Yes, delete my chat"';
          const next = '"Delete chat"';
          if (!s.includes(old)) throw new Error('Delete-chat confirmation label not found');
          s = s.replace(old, next);
          fs.writeFileSync(p, s);
          NODE
      - name: Run regression tests
        run: npm test
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-delete-chat-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js .github/workflows/fix-delete-chat-label.yml
          git commit -m "Polish delete chat confirmation on mobile"
          git push origin annapurna-working
