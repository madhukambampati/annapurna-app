name: Remove signed-in home eyebrow

on:
  push:
    branches: [remove-signed-in-home-eyebrow]

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-signed-in-home-eyebrow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hide after-login eyebrow only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/heritage-v11.css')
          s = p.read_text()
          old = 'body.customer-mode .home-eyebrow{display:inline-flex!important;color:#9d6812!important;background:transparent!important;border:0!important;padding:0!important;font-size:11px!important;font-weight:900!important;letter-spacing:.19em!important;text-transform:uppercase!important}'
          new = 'body.customer-mode .home-eyebrow{display:none!important}'
          if old not in s:
              raise SystemExit('signed-in home eyebrow rule not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify intended change only
        run: |
          grep -F 'body.customer-mode .home-eyebrow{display:none!important}' public/heritage-v11.css
          git diff -- public/heritage-v11.css
      - name: Full regression suite
        run: npm test
      - name: Whitespace check
        run: git diff --check
      - name: Commit tested change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/heritage-v11.css
          git rm .github/workflows/remove-signed-in-home-eyebrow.yml
          git commit -m 'Remove signed-in home eyebrow text'
          git push origin HEAD:remove-signed-in-home-eyebrow
