name: One-time production deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Add one-time production deploy workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify live app
        run: |
          set -euo pipefail
          base='https://annapurna-maddy-kw.fly.dev'
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 "$base/health" | grep -q '"ok":true'; then break; fi
            sleep 5
          done
          curl --fail --silent --show-error --max-time 20 "$base/" -o /tmp/index.html
          curl --fail --silent --show-error --max-time 20 "$base/app.js" -o /tmp/app.js
          grep -q 'Hi! I’m Vindhu, your Annapurna ordering assistant 🍛' /tmp/index.html
          grep -q 'Hi! I’m Vindhu, your Annapurna ordering assistant 🍛' /tmp/app.js
          echo 'LIVE_CHECK: Vindhu greeting is live'
