name: Manual theme toggle

on:
  push:
    branches:
      - manual-theme-toggle-v1

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manual-theme-toggle-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply theme controls
        run: node scripts/manual-theme-toggle-v1.cjs
      - name: Check browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit theme controls and remove temporary runner
        shell: bash
        run: |
          rm scripts/manual-theme-toggle-v1.cjs
          rm .github/workflows/manual-theme-toggle-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add manual light and dark theme controls"
          git push origin manual-theme-toggle-v1
