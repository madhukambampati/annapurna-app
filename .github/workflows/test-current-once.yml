name: One-time current branch test

on:
  push:
    branches: [ui-redesign-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD || true
      - name: Full automated suite
        run: npm test
      - name: Live public smoke checks
        run: |
          set -euo pipefail
          base='https://annapurna-maddy-kw.fly.dev'
          curl --fail --silent --show-error --max-time 20 "$base/health" | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          curl --fail --silent --show-error --max-time 20 "$base/" -o /tmp/home.html
          grep -q 'Annapurna' /tmp/home.html
          curl --fail --silent --show-error --max-time 20 "$base/web/menu" -o /tmp/menu.json
          grep -q '"items"' /tmp/menu.json
          curl --fail --silent --show-error --max-time 20 "$base/desk" -o /tmp/desk.html
          grep -q 'Annapurna' /tmp/desk.html
