name: Fix mobile brand subtitle

on:
  push:
    branches: [annapurna-working]
    paths: ['.github/workflows/mobile-brand-subtitle.yml']

permissions:
  contents: write

jobs:
  tweak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annapurna-working
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Show Home Foods and Vindhu Assistant on mobile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/index.html';
          let s = fs.readFileSync(path, 'utf8');
          const marker = '</style>';
          if (!s.includes(marker)) throw new Error('style closing tag not found');
          const css = `
          /* Launch polish: keep the Annapurna + Vindhu identity visible on compact phones. */
          @media(max-width:520px){
            .customer-mode .brand{min-width:0}
            .customer-mode .brand h1{font-size:16.5px;line-height:1.05}
            .customer-mode .brand small{display:block!important;font-size:8.7px;line-height:1.1;white-space:nowrap;overflow:visible;text-overflow:clip;letter-spacing:0}
            .customer-mode .brand small::after{display:inline!important;content:" · Vindhu Assistant";margin-left:2px;color:var(--brand2);font-size:8px;font-weight:800;letter-spacing:.02em}
          }
          `;
          if (!s.includes('Launch polish: keep the Annapurna + Vindhu identity visible on compact phones.')) {
            s = s.replace(marker, css + marker);
            fs.writeFileSync(path, s);
          }
          NODE

      - name: Run regression tests
        run: npm test

      - name: Commit mobile subtitle fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/mobile-brand-subtitle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/mobile-brand-subtitle.yml
          git commit -m "Show Vindhu assistant subtitle on mobile"
          git push origin annapurna-working
