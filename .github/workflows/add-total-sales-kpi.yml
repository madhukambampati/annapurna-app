name: Add total sales KPI

on:
  push:
    branches: [add-total-sales-kpi]

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-total-sales-kpi
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python3 scripts/add-total-sales-kpi.py
      - name: Verify intended changes
        run: |
          node --check public/desk.js
          grep -q '"Total sales"' public/desk.js
          grep -q 'All non-cancelled orders' public/desk.js
          grep -q 'repeat(5,minmax(0,1fr))' public/desk.html
      - name: Full regression suite
        run: npm test
      - name: Whitespace check
        run: git diff --check
      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/desk.js public/desk.html
          git commit -m "Add total sales KPI to owner dashboard"
      - name: Remove temporary patch files
        run: |
          rm scripts/add-total-sales-kpi.py .github/workflows/add-total-sales-kpi.yml
          git add -A
          git commit -m "Remove temporary total sales patch files"
          git push origin HEAD:add-total-sales-kpi
