name: One-time Vindhu rename

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: github.event.head_commit.message != 'Rename ordering assistant to Vindhu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rename assistant in customer UI
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['public/index.html', 'public/app.js']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('Annu', 'Vindhu')
              s = s.replace("Namaste! I'm Vindhu.", "Hi! I’m Vindhu, your Annapurna ordering assistant 🍛")
              p.write_text(s)
          PY
      - name: Verify change
        run: |
          grep -q 'Hi! I’m Vindhu, your Annapurna ordering assistant 🍛' public/index.html
          grep -q 'Hi! I’m Vindhu, your Annapurna ordering assistant 🍛' public/app.js
          ! grep -q 'Annu' public/index.html
          ! grep -q 'Annu' public/app.js
          node --check public/app.js
          git diff --check
      - name: Full regression suite
        run: |
          npm ci
          npm test
      - name: Commit rename
        run: |
          git config user.name 'madhukambampati'
          git config user.email '85366523+madhukambampati@users.noreply.github.com'
          git add public/index.html public/app.js
          git commit -m 'Rename ordering assistant to Vindhu'
          git push origin HEAD:main
