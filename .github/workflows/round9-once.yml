name: One-time Round 9 resume rate-limit hotfix

on:
  push:
    branches: [ui-redesign-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Round 9 patch
        run: python3 .github/round9_patch.py
      - name: Install
        run: npm ci
      - name: Syntax check browser JavaScript
        run: node --check public/app.js
      - name: Check whitespace
        run: git diff --check
      - name: Test
        run: npm test
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js test/web.test.ts
          git commit -m "Fix returning-session rate-limit fallback"
          git push origin HEAD:ui-redesign-v1
