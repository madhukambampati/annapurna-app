name: Combo any-day owner confirm once

on:
  push:
    branches:
      - combo-anyday-owner-confirm-v1

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: combo-anyday-owner-confirm-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Apply combo availability change
        run: python3 .github/combo-anyday-owner-confirm.py
      - name: Install
        run: npm ci
      - name: Browser syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: npm test
      - name: Validate patch
        run: |
          git diff --check
          grep -Fq 'Ask us for your preferred pickup day' src/server.ts
          grep -Fq 'Reply YES to send this availability request' src/agent.ts
          grep -Fq 'Availability check needed for' src/guards.ts
          grep -Fq '["Combos", h("div"' public/app.js
          if grep -Fqi 'Weekend combos' public/app.js public/index.html; then
            echo 'Old weekend-only customer UI wording still present' >&2
            exit 1
          fi
          git diff --name-only
      - name: Commit change
        run: |
          git add public/index.html public/app.js src/prompt.ts src/guards.ts src/agent.ts src/server.ts test/guards.test.ts
          git commit -m 'Allow combo requests on any day with owner confirmation'
          git push origin HEAD:combo-anyday-owner-confirm-v1
