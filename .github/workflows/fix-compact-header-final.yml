name: Final compact header override

on:
  push:
    branches: [annapurna-working]
    paths: ['.github/workflows/fix-compact-header-final.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annapurna-working
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Add final 320px override after all existing styles
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/index.html';
          let s = fs.readFileSync(path, 'utf8');
          if (!s.includes('id="compact340final"')) {
            const css = [
              '<style id="compact340final">',
              '@media(max-width:340px){',
              '  .customer-mode .top{gap:4px!important;padding-left:6px!important;padding-right:6px!important}',
              '  .customer-mode .seal{width:34px!important;height:34px!important;border-radius:11px!important}',
              '  .customer-mode .brand{max-width:78px!important;min-width:0!important}',
              '  .customer-mode .brand h1{font-size:14px!important;line-height:1.02!important;white-space:nowrap!important}',
              '  .customer-mode .brand small{display:block!important;font-size:7.8px!important;line-height:1.05!important;white-space:nowrap!important;overflow:hidden!important}',
              '  .customer-mode .brand small::after{display:none!important}',
              '  .customer-mode .tabs{gap:0!important}',
              '  .customer-mode .tab{min-width:41px!important;padding-left:2px!important;padding-right:2px!important;font-size:9.5px!important}',
              '}',
              '</style>',
              ''
            ].join('\n');
            if (!s.includes('</head>')) throw new Error('head closing tag not found');
            s = s.replace('</head>', css + '</head>');
            fs.writeFileSync(path, s);
          }
          NODE
      - name: Run regression tests
        run: npm test
      - name: Commit and clean workflow
        shell: bash
        run: |
          rm .github/workflows/fix-compact-header-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/fix-compact-header-final.yml
          git commit -m "Harden compact mobile header layout"
          git push origin annapurna-working
