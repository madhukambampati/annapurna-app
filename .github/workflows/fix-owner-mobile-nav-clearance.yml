name: Fix owner mobile navigation clearance
on:
  push:
    branches: [fix-owner-mobile-nav-clearance]
permissions:
  contents: write
jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-owner-mobile-nav-clearance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add mobile nav clearance
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/desk.html')
          s = p.read_text()
          marker = '</head>'
          block = '''\n<style id="ownerMobileNavClearanceV1">\n/* Keep mobile owner content fully scrollable above the fixed bottom navigation. */\n@media(max-width:899px){\n  body.owner-mode:not(.chat-open-mobile){\n    padding-bottom:18px!important;\n    scroll-padding-bottom:calc(128px + env(safe-area-inset-bottom))!important;\n  }\n  body.owner-mode:not(.chat-open-mobile)>#panel{\n    padding-bottom:calc(128px + env(safe-area-inset-bottom))!important;\n  }\n  body.owner-mode:not(.chat-open-mobile)>#tabs{\n    bottom:calc(8px + env(safe-area-inset-bottom))!important;\n  }\n}\n@media(max-width:620px){\n  body.owner-mode:not(.chat-open-mobile)>#panel{\n    padding-bottom:calc(136px + env(safe-area-inset-bottom))!important;\n  }\n}\n</style>\n'''
          if 'ownerMobileNavClearanceV1' not in s:
              if marker not in s:
                  raise SystemExit('head marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          PY
      - name: Validate
        run: |
          npm test
          git diff --check
          grep -q 'ownerMobileNavClearanceV1' public/desk.html
      - name: Commit tested fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/desk.html
          git commit -m 'Fix mobile owner navigation content clearance'
          git rm .github/workflows/fix-owner-mobile-nav-clearance.yml
          git commit -m 'Remove temporary mobile nav fix workflow'
          git push origin HEAD:fix-owner-mobile-nav-clearance
