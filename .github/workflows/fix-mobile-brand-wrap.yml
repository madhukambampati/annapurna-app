name: Fix mobile brand wrap

on:
  push:
    branches: [annapurna-working]
    paths: ['.github/workflows/fix-mobile-brand-wrap.yml']

permissions:
  contents: write

jobs:
  tweak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annapurna-working
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fix mobile brand subtitle wrapping
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/index.html';
          let s = fs.readFileSync(path, 'utf8');
          const marker = '</style>';
          if (!s.includes(marker)) throw new Error('style closing tag not found');
          const css = `
/* Final mobile header fix: keep Vindhu visible without overlapping navigation. */
@media(max-width:520px){
  .customer-mode .top{gap:6px;padding-left:8px;padding-right:8px}
  .customer-mode .brand{min-width:104px;max-width:118px;overflow:hidden}
  .customer-mode .brand h1{font-size:16px;line-height:1.02;white-space:nowrap}
  .customer-mode .brand small{display:block!important;font-size:9px;line-height:1.05;white-space:normal!important;overflow:hidden!important;text-overflow:clip!important;letter-spacing:0}
  .customer-mode .brand small::after{display:block!important;content:"VINDHU ASSISTANT"!important;margin:2px 0 0!important;color:var(--brand2);font-size:7.8px!important;font-weight:900;line-height:1.05;letter-spacing:.05em!important;white-space:nowrap}
  .customer-mode .tabs{gap:0}
  .customer-mode .tab{min-width:42px;padding-left:3px;padding-right:3px;font-size:10px}
}
`;
          if (!s.includes('Final mobile header fix: keep Vindhu visible without overlapping navigation.')) {
            s = s.replace(marker, css + marker);
            fs.writeFileSync(path, s);
          }
          NODE

      - name: Run regression tests
        run: npm test

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-mobile-brand-wrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/fix-mobile-brand-wrap.yml
          git commit -m "Fix mobile Vindhu subtitle overlap"
          git push origin annapurna-working
