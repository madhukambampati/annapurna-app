.customer-mode .ord .steps4 li.on::before{background:#14a76b;box-shadow:0 0 0 4px #e1f4e9}
.customer-mode .ord .steps4 li.current-step::after{display:none}
.customer-mode .ord-meta>div{background:#fbf8f1}

.customer-mode .sheet{background:#f8f4ea}.customer-mode .sheet>header{background:#fffdf9}.customer-mode .day{background:#fffdf9}
.customer-mode .links .btn{border-radius:13px}

@media(max-width:699px){
