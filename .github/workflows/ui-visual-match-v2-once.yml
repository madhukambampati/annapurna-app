name: One-time visual reference refresh

on:
  push:
    branches: [ui-visual-match-v2]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.head_commit.message == 'Fix visual refresh workflow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply presentation-only visual refresh
        env:
          CUSTOMER_CSS_B64: "PHN0eWxlIGlkPSJ2aXN1YWxSZWZlcmVuY2VNYXRjaFYzIj4KLyo        " 
          OWNER_CSS_B64: " dGlja2V0IGJ7Zm9udC1zaXplOjE2cHh9LnRpY2tldCAuY29udGFjdHtjb2xvcjojNzI4MDc3fQpib2R5Lm93bmVyLW1vZGUgLnRpY2tldCAud2hlbntiYWNrZ3JvdW5kOiNmZmYxZGY7Y29sb3I6I2NlNjUyMn0u  "
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          pairs=[('public/index.html','CUSTOMER_CSS_B64'),('public/desk.html','OWNER_CSS_B64')]
          for path,key in pairs:
              p=Path(path); s=p.read_text(); css=base64.b64decode(os.environ[key]).decode()
              marker=css.split('\n',2)[1]
              if marker in s: raise SystemExit(path+' already patched')
              s=s.replace('</head>',css+'\n</head>',1)
              p.write_text(s)
          PY
      - name: Verify frontend-only scope
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "public/desk.html public/index.html "
          git diff --check
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: |
          npm ci
          npm test
      - name: Commit presentation changes
        run: |
          git config user.name 'madhukambampati'
          git config user.email '85366523+madhukambampati@users.noreply.github.com'
          git add public/index.html public/desk.html
          git commit -m 'Polish customer and owner UI to match visual reference'
          git push origin HEAD:ui-visual-match-v2
