name: One-time visual reference refresh

on:
  push:
    branches: [ui-visual-match-v2]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Add one-time visual refresh workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply presentation-only visual refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          customer_css = r'''
<style id="visualReferenceMatchV3">
/* PRESENTATION-ONLY REFRESH. No ordering, pricing, session or API behavior is changed. */
:root{
  color-scheme:light;
  --bg:#eef4e8;--page:#f8f4ea;--surface:#fffdf8;--surface2:#f4ecdd;--ink:#15291d;
  --muted:#627166;--dim:#879087;--line:#e9dfcc;--line2:#d8cbb2;
  --brand:#0f7a4d;--brand2:#075f3a;--brand-soft:#e0f3e8;
  --accent:#ff8a1f;--accent-soft:#fff0dc;--on-accent:#472200;
  --chilli:#ef563f;--chilli-soft:#ffe7e2;--cust:#0f8a58;--on-cust:#fff;--agent:#fffdf8;--owner:#fff2dc;
  --shadow:0 18px 45px rgba(28,63,43,.13);
}
