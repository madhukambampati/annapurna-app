name: One-time visual reference refresh

on:
  push:
    branches: [ui-visual-match-v2]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.head_commit.message == 'Use CSS source files for visual refresh' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply presentation-only visual refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          pairs = [
              ('public/index.html', '.github/ui/customer-visual-v3.css', 'visualReferenceMatchV3'),
              ('public/desk.html', '.github/ui/owner-visual-v3.css', 'ownerVisualReferenceMatchV3'),
          ]
          for target, source, marker in pairs:
              p = Path(target)
              s = p.read_text()
              if marker in s:
                  raise SystemExit(f'{target}: already patched')
              css = Path(source).read_text()
              block = f'\n<style id="{marker}">\n{css}\n</style>\n'
              if '</head>' not in s:
                  raise SystemExit(f'{target}: missing head')
              p.write_text(s.replace('</head>', block + '</head>', 1))
          PY
      - name: Verify frontend-only scope
        run: |
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          test "$changed" = "public/desk.html public/index.html "
          git diff --check
          node --check public/app.js
          node --check public/desk.js
      - name: Full regression suite
        run: |
          npm ci
          npm test
      - name: Commit presentation changes
        run: |
          git config user.name 'madhukambampati'
          git config user.email '85366523+madhukambampati@users.noreply.github.com'
          git add public/index.html public/desk.html
          git commit -m 'Polish customer and owner UI to match visual reference'
          git push origin HEAD:ui-visual-match-v2
