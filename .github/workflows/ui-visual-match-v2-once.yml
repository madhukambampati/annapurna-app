    --accent:#ff8a1f;--accent-soft:#fff0dc;--on-accent:#472200;
    --chilli:#ef563f;--chilli-soft:#ffe7e2;--cust:#0f8a58;--on-cust:#fff;--agent:#fffdf8;--owner:#fff2dc;
    --shadow:0 18px 45px rgba(28,63,43,.13);
  }
}
body{background:#e8f0e1;color:var(--ink)}
.customer-mode .app{background:var(--page);border:1px solid #dce7d8}
