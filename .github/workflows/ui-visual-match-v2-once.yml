    background:rgba(255,253,248,.97);border-top:1px solid #e6dece;box-shadow:0 -10px 30px rgba(31,57,41,.10);backdrop-filter:blur(18px)
  }
  .customer-mode .tab{min-width:0;border-radius:13px;padding:7px 3px;color:#718078}
  .customer-mode .tab[aria-current=true]{background:#e4f3e8;color:#0c7d4e}.customer-mode .tab[aria-current=true]::after{display:none}
  .customer-home,.onboard,.customer-mode .chat{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .customer-mode .composer{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .home-hero{grid-template-columns:1fr;min-height:0;padding:23px 20px 12px;border-radius:24px}
  .home-copy h2{font-size:35px}.home-annuwrap{min-height:180px;margin-top:-8px}.home-annuwrap .mascot{width:142px}.home-bubble{margin-top:-16px}
  .home-hero-actions{width:100%;margin-top:18px}.home-primary{min-width:0;flex:1}.home-secondary{min-height:58px}
  .home-grid{grid-template-columns:repeat(2,1fr)}.home-tile{grid-template-columns:42px 1fr;min-height:104px;padding:13px}.home-tile>.home-arrow{display:none}
  .customer-mode .dish{padding-left:82px}.customer-mode .dish::before{width:56px;height:56px;font-size:29px}
}
</style>
'''

          owner_css = r'''
<style id="ownerVisualReferenceMatchV3">
