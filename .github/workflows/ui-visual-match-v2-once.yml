/* Orders read more like the reference live-tracking cards. */
.customer-mode .ord{border-radius:22px;background:#fffdf8;border:1px solid #e7dece}
.customer-mode .ord::before{width:6px;background:#10a267}.customer-mode .ord-head b{font-size:23px}
.customer-mode .ord .steps4{display:grid;grid-template-columns:1fr;gap:0;padding:4px 18px 14px 30px}
