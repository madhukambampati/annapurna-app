name: One-time Vindhu rename

on:
  push:
    branches: [ui-redesign-v1]

permissions:
  contents: write

jobs:
  rename-and-test:
    if: github.event.head_commit.message == 'Add one-time Vindhu rename workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rename customer-facing assistant to Vindhu
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              Path('public/index.html'): [
                  ("Choose a path below. Annu will help with the details and we always show you the full order before placing it.",
                   "Choose a path below. Vindhu will help with the details and we always show you the full order before placing it."),
                  ("Chat with Annu", "Chat with Vindhu"),
                  ("Say hi to Annu, our assistant", "Say hi to Vindhu, our assistant"),
                  ("Namaste! I'm Annu.", "Hi! I’m Vindhu, your Annapurna ordering assistant 🍛"),
              ],
              Path('public/app.js'): [
                  ("\"Namaste! I'm Annu.\"", "\"Hi! I’m Vindhu, your Annapurna ordering assistant 🍛\""),
              ],
              Path('public/desk.js'): [
                  ('m.who === "owner" ? "You" : "Annu"', 'm.who === "owner" ? "You" : "Vindhu"'),
              ],
          }

          for path, replacements in changes.items():
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Install
        run: npm ci
      - name: Browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/desk.js
      - name: Full automated regression suite
        run: npm test
      - name: Verify Vindhu copy
        run: |
          grep -Fq 'Hi! I’m Vindhu, your Annapurna ordering assistant 🍛' public/index.html
          grep -Fq 'Hi! I’m Vindhu, your Annapurna ordering assistant 🍛' public/app.js
          grep -Fq 'Chat with Vindhu' public/index.html
          grep -Fq 'Vindhu will help with the details' public/index.html
          grep -Fq '"Vindhu"' public/desk.js
      - name: Commit rename
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/app.js public/desk.js
          git commit -m 'Rename ordering assistant to Vindhu'
          git push origin HEAD:ui-redesign-v1
