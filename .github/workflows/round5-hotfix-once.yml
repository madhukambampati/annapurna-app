name: One-time Round 5 hotfix

on:
  push:
    branches: [ui-redesign-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run Round 5 hotfix automation'
    runs-on: ubuntu-latest
    env:
      HOTFIX_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-redesign-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Round 5 patch
        run: |
          python3 - <<'PY'
          import os, base64, gzip
          from pathlib import Path
          Path('/tmp/round5_patch.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['HOTFIX_B64'])))
          PY
          python3 /tmp/round5_patch.py
      - run: npm ci
      - run: git diff --check
      - run: npm test
      - name: Commit tested Round 5 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent.ts src/server.ts public/app.js public/index.html test/web.test.ts
          git commit -m "Fix bulk custom order session recovery"
          git push origin HEAD:ui-redesign-v1
