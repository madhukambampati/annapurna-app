name: Launch phone validation hardening

on:
  push:
    branches: [annapurna-working]
    paths: ['.github/workflows/launch-phone-validation.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annapurna-working
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Harden customer phone validation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(path, oldText, newText) {
            let s = fs.readFileSync(path, 'utf8');
            if (!s.includes(oldText)) throw new Error(`Expected block not found in ${path}`);
            s = s.replace(oldText, newText);
            fs.writeFileSync(path, s);
          }

          replaceOnce('public/app.js', `  function contactValidationError(value) {
    var contact = String(value || "").trim();
    if (!contact) return "Please enter a phone number or email.";
    if (contact.length > 80) return "Phone or email is too long.";
    if (contact.indexOf("@") !== -1) {
      if (!/^[^\\s@]+@[^\\s@]+\\.[A-Za-z]{2,63}$/.test(contact)) return "Please enter a valid email, for example name@example.com.";
      return "";
    }
    if (!/^[+()\\-. \\d]+$/.test(contact)) return "Please enter a valid phone number or email.";
    var plusCount = (contact.match(/\\+/g) || []).length;
    if (plusCount > 1 || (plusCount === 1 && contact.charAt(0) !== "+")) return "The + sign can only appear at the beginning of a phone number.";
    var digits = contact.replace(/\\D/g, "");
    if (digits.length < 7 || digits.length > 15) return "Please enter a phone number with 7 to 15 digits.";
    return "";
  }`, `  function contactValidationError(value) {
    var contact = String(value || "").trim();
    if (!contact) return "Please enter a phone number or email.";
    if (contact.length > 80) return "Phone or email is too long.";
    if (contact.indexOf("@") !== -1) {
      if (!/^[^\\s@]+@[^\\s@]+\\.[A-Za-z]{2,63}$/.test(contact)) return "Please enter a valid email, for example name@example.com.";
      return "";
    }
    if (!/^[+()\\-. \\d]+$/.test(contact)) return "Please enter a valid Canadian/US phone number, or use your email.";
    var plusCount = (contact.match(/\\+/g) || []).length;
    if (plusCount > 1 || (plusCount === 1 && contact.charAt(0) !== "+")) return "The + sign can only appear at the beginning of a phone number.";
    var digits = contact.replace(/\\D/g, "");
    if (digits.length === 11 && digits.charAt(0) === "1") digits = digits.slice(1);
    if (digits.length !== 10) return "Please enter a 10-digit Canadian/US phone number, or use your email.";
    if (!/^[2-9]\\d{2}[2-9]\\d{6}$/.test(digits)) return "Please enter a valid Canadian/US phone number, or use your email.";
    if (/(\\d)\\1{5,}/.test(digits) || /(012345|123456|234567|345678|456789|567890|098765|987654|876543|765432|654321|543210)/.test(digits)) return "Please enter a real phone number, or use your email.";
    return "";
  }`);

          replaceOnce('src/server.ts', `/** A valid email or phone number containing 7-15 digits. */
export function validContact(c: string): boolean {
  const value = c.trim();
  if (value.length < 5 || value.length > 80) return false;
  if (value.includes("@")) return /^[^\\s@]+@[^\\s@]+\\.[A-Za-z]{2,63}$/.test(value);
  if (!/^[+()\\-. \\d]+$/.test(value)) return false;
  const plusCount = (value.match(/\\+/g) ?? []).length;
  if (plusCount > 1 || (plusCount === 1 && !value.startsWith("+"))) return false;
  const digits = value.replace(/\\D/g, "");
  return digits.length >= 7 && digits.length <= 15;
}`, `/** A syntactically valid email or a plausible Canadian/US (NANP) phone number. */
export function validContact(c: string): boolean {
  const value = c.trim();
  if (value.length < 5 || value.length > 80) return false;
  if (value.includes("@")) return /^[^\\s@]+@[^\\s@]+\\.[A-Za-z]{2,63}$/.test(value);
  if (!/^[+()\\-. \\d]+$/.test(value)) return false;
  const plusCount = (value.match(/\\+/g) ?? []).length;
  if (plusCount > 1 || (plusCount === 1 && !value.startsWith("+"))) return false;
  let digits = value.replace(/\\D/g, "");
  if (digits.length === 11 && digits.startsWith("1")) digits = digits.slice(1);
  if (digits.length !== 10) return false;
  // NANP area code and exchange must each start with 2-9.
  if (!/^[2-9]\\d{2}[2-9]\\d{6}$/.test(digits)) return false;
  // Reject obvious placeholder/test patterns without trying to guess whether every number is assigned.
  if (/(\\d)\\1{5,}/.test(digits)) return false;
  if (/(012345|123456|234567|345678|456789|567890|098765|987654|876543|765432|654321|543210)/.test(digits)) return false;
  return true;
}`);

          replaceOnce('test/web.test.ts', `test("customer identity validation accepts real values and rejects junk", () => {
  for (const ok of ["519-555-0101", "+1 (519) 555 0101", "maddy@example.com", "5195550101"]) assert.equal(validContact(ok), true, ok);
  for (const bad of ["", "abc", "12345", "not an email@", "a@b", "519+5550101", "1234567890123456", "<script>alert(1)</script>", "x".repeat(81)]) assert.equal(validContact(bad), false, bad);
  for (const ok of ["Asha", "M. Kiran", "Siva-Parvathi", "José", "O'Connor"]) assert.equal(validName(ok), true, ok);
  for (const bad of ["", "1234", "M@xy", "Madhu_1", "<script>alert(1)</script>", "A < B", "x".repeat(61)]) assert.equal(validName(bad), false, bad);
});`, `test("customer identity validation accepts real values and rejects junk", () => {
  for (const ok of ["519-555-0101", "+1 (519) 555 0101", "maddy@example.com", "5195550101", "6478043658"]) assert.equal(validContact(ok), true, ok);
  for (const bad of ["", "abc", "12345", "not an email@", "a@b", "519+5550101", "1234567890", "12345678890", "1111111111", "0000000000", "5191550101", "+1 (123) 456-7890", "1234567890123456", "<script>alert(1)</script>", "x".repeat(81)]) assert.equal(validContact(bad), false, bad);
  for (const ok of ["Asha", "M. Kiran", "Siva-Parvathi", "José", "O'Connor"]) assert.equal(validName(ok), true, ok);
  for (const bad of ["", "1234", "M@xy", "Madhu_1", "<script>alert(1)</script>", "A < B", "x".repeat(61)]) assert.equal(validName(bad), false, bad);
});`);

          replaceOnce('test/web.test.ts', `      assert.equal((await s({ name: "A", contact: "nope", consent: true })).status, 400);
      assert.equal((await s({ name: "A", contact: "5195550101" })).status, 400);`, `      assert.equal((await s({ name: "A", contact: "nope", consent: true })).status, 400);
      assert.equal((await s({ name: "A", contact: "1234567890", consent: true })).status, 400);
      assert.equal((await s({ name: "A", contact: "12345678890", consent: true })).status, 400);
      assert.equal((await s({ name: "A", contact: "5195550101" })).status, 400);`);
          NODE
      - name: Run regression tests
        run: npm test
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/launch-phone-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js src/server.ts test/web.test.ts .github/workflows/launch-phone-validation.yml
          git commit -m "Harden launch phone validation"
          git push origin annapurna-working
