<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Traditional South Indian home food scene">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6e6ba"/><stop offset=".48" stop-color="#c68542"/><stop offset="1" stop-color="#5b2f1d"/></linearGradient>
  <linearGradient id="sari" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b6a47"/><stop offset="1" stop-color="#063e2c"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a6"/><stop offset=".45" stop-color="#d89a22"/><stop offset="1" stop-color="#8f5710"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9592d"/><stop offset="1" stop-color="#64321f"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#fff3bd" stop-opacity=".95"/><stop offset="1" stop-color="#fff3bd" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#3b1d0d" flood-opacity=".32"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#bg)"/>
<circle cx="1040" cy="120" r="180" fill="url(#glow)" opacity=".6"/>
<g opacity=".22" fill="#fff7d7" filter="url(#soft)"><circle cx="935" cy="95" r="38"/><circle cx="1050" cy="185" r="52"/><circle cx="815" cy="160" r="26"/><circle cx="1120" cy="330" r="34"/></g>
