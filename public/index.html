<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annapurna Home Foods: order here</title>
<meta name="description" content="Order authentic home-cooked South Indian food from Annapurna in Kitchener. Chat to order, pick up fresh.">
<meta name="theme-color" content="#9a2237">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Annapurna">
<style>
:root{
  color-scheme:dark;
  --bg:#180a0d;--panel:#241017;--panel2:#2f151d;--line:#4a2b33;--line2:#63383f;
  --cream:#f7ead3;--muted:#c4a89b;--dim:#9c8177;--gold:#e8b04b;--maroon:#9a2237;--chilli:#ee5a4b;--leaf:#8ccb85;
  --me:#4d3512;--agent:#33171f;--maddy:#1f3a2a;
  --f-display:Georgia,"Times New Roman",serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Telugu",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.45 var(--f-body);
  background-image:radial-gradient(800px 380px at 10% -10%,rgba(154,34,55,.38),transparent 70%),radial-gradient(600px 320px at 100% 0,rgba(232,176,75,.10),transparent 70%);background-repeat:no-repeat}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

/* header */
.head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(180deg,#4a1220,#33101a);border-bottom:1px solid var(--line)}
.seal{width:42px;height:42px;border-radius:50%;flex:none}
.head h1{margin:0;font:400 19px/1.15 var(--f-display);color:var(--gold)}
.head small{color:var(--muted);font-size:12.5px}
.head .grow{flex:1;min-width:0}
.hbtn{border:1px solid var(--line2);background:transparent;border-radius:10px;padding:7px 11px;font-size:14px;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--gold)}
.hbtn .dotn{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--gold);color:#2b1608;font-size:11.5px;font-weight:700;line-height:18px;text-align:center}

/* onboarding */
.onboard{flex:1;overflow-y:auto;padding:22px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.onboard h2{margin:0;font:400 28px/1.1 var(--f-display);text-wrap:balance}
.onboard p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],textarea{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;width:100%;font-size:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--gold)}
.btn{border:0;background:var(--gold);color:#2b1608;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line2);font-weight:500}
.err{color:#ff9a8f;font-size:14px;min-height:1.2em}
.tiny{font-size:12.5px;color:var(--dim)}

/* chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:9px;
  background-image:radial-gradient(circle at 1px 1px,rgba(232,176,75,.09) 1px,transparent 0);background-size:22px 22px;-webkit-overflow-scrolling:touch}
.b{max-width:86%;padding:9px 12px 6px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.b time{display:block;text-align:right;font-size:11px;color:var(--dim);margin-top:2px}
.b.cust{align-self:flex-end;background:var(--me);border:1px solid #6b4a1a;border-bottom-right-radius:4px}
.b.agent{align-self:flex-start;background:var(--agent);border:1px solid var(--line);border-bottom-left-radius:4px}
.b.owner{align-self:flex-start;background:var(--maddy);border:1px solid #2f5a42;border-bottom-left-radius:4px}
.b .who{display:block;font-size:11.5px;font-weight:700;color:var(--leaf);margin-bottom:2px}
.b.pending{opacity:.7}
.typing{align-self:flex-start;background:var(--agent);border:1px solid var(--line);border-radius:16px;padding:11px 14px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.hello{margin:auto;text-align:center;color:var(--muted);max-width:280px}
.toast{align-self:center;font-size:13px;padding:5px 12px;border-radius:999px;background:rgba(238,90,75,.16);color:#ff9a8f;text-align:center}
.chips{display:flex;gap:7px;padding:8px 14px 2px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chips button:hover{border-color:var(--gold);color:var(--gold)}
.composer{display:flex;gap:8px;padding:8px 12px calc(12px + env(safe-area-inset-bottom));align-items:flex-end}
.composer textarea{flex:1;resize:none;border-radius:20px;min-height:46px;max-height:120px;padding:11px 15px}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--gold);color:#2b1608;cursor:pointer;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg{width:21px;height:21px}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:560px;max-height:88dvh;background:var(--panel);border:1px solid var(--line2);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet>header h2{margin:0;font:400 20px/1.1 var(--f-display);color:var(--gold)}
.sheet .body{overflow-y:auto;padding:12px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:6px 0 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.item.off{opacity:.55}
.item b{display:block}
.item small{color:var(--muted)}
.price{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--gold);font-weight:700}
.price small{display:block;color:var(--muted);font-weight:400}
.ord{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.wk{margin:0 0 9px;line-height:1.4}
.ord ul{margin:6px 0;padding-left:18px}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;background:rgba(232,176,75,.16);color:var(--gold)}
.st.ready{background:rgba(140,203,133,.18);color:var(--leaf)}
.st.cancelled{background:rgba(238,90,75,.16);color:#ff9a8f}
.st.done{background:rgba(255,255,255,.08);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <img class="seal" src="/icon.svg" alt="" width="42" height="42">
    <div class="grow"><h1>Annapurna</h1><small>Authentic home foods · Kitchener</small></div>
    <button class="hbtn" id="btnMenu" type="button">Menu</button>
    <button class="hbtn" id="btnOrders" type="button" hidden>Orders<span class="dotn" id="ordDot" hidden></span></button>
  </header>

  <main class="onboard" id="onboard" hidden>
    <h2>Order fresh home-cooked food</h2>
    <p>Chat with our assistant to place an order. Maddy checks every order and cooks it fresh for pickup.</p>
    <form class="card" id="startForm" autocomplete="on">
      <label class="f">Your name<input type="text" id="fName" name="name" autocomplete="name" maxlength="60" required></label>
      <label class="f">Phone or email (so Maddy can reach you)<input type="text" id="fContact" name="contact" autocomplete="tel" inputmode="text" maxlength="80" required></label>
      <label class="check"><input type="checkbox" id="fConsent"><span>I understand this chat is handled by an AI assistant. My messages and name are shared with the AI services that power it, and Maddy can read my chat and orders.</span></label>
      <div class="err" id="startErr" role="alert"></div>
      <button class="btn" id="startBtn" type="submit">Start chat</button>
      <button class="btn ghost" id="startMenu" type="button">See the menu first</button>
    </form>
    <p class="tiny">You can delete your chat any time from the chat screen. Placed orders are kept so Maddy can cook them.</p>
  </main>

  <section class="chat" id="chat" hidden>
    <div class="msgs" id="msgs" aria-live="polite" aria-label="Chat"></div>
    <div class="chips" id="chips"></div>
    <form class="composer" id="composer">
      <textarea id="text" rows="1" maxlength="1000" placeholder="Type your order or question..." aria-label="Your message"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg></button>
    </form>
  </section>
</div>

<div class="veil" id="veil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h2 id="sheetTitle"></h2><button class="hbtn" id="sheetClose" type="button">Close</button></header>
    <div class="body" id="sheetBody"></div>
  </div>
</div>
<script src="/app.js" defer></script>
</body>
</html>
