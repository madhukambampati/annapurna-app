<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d6b4d">
<title>Annapurna Order Desk</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:light dark;
  --bg:#efe8d8;--panel:#fffdf8;--panel2:#f6efe0;--line:#e6dcc6;--line2:#d2c6ac;
  --cream:#1b2a21;--muted:#56645a;--gold:#1d6b4d;--on-gold:#fff;--chilli:#b83527;--leaf:#1d6b4d;
  --me:#dfeee5;--agent:#f6efe0;--maddy:#fff0c9;--paper:#fffdf8;--ink:#1b2a21;--flag:#b83527;--bad:#b83527;
  --f-display:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b120d;--panel:#16211a;--panel2:#1d2c22;--line:#26382c;--line2:#33493a;
    --cream:#eaf1e6;--muted:#a5b6a9;--gold:#46b385;--on-gold:#06210f;--chilli:#ff9282;--leaf:#5cc79a;
    --me:#1a3a2b;--agent:#1d2c22;--maddy:#3a2d0e;--paper:#1d2c22;--ink:#eaf1e6;--flag:#ff9282;--bad:#ff9282;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px 16px 40px;max-width:1100px;margin-inline:auto}
h1{margin:0 0 2px;font:700 26px/1.1 var(--f-display);color:var(--gold)}
h2{margin:14px 0 8px;font:700 18px/1.2 var(--f-display)}
.sub{color:var(--muted);font-size:13px;margin:0 0 8px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1.5px solid var(--line2);border-radius:10px;padding:8px 11px;min-width:0}
button{border:1.5px solid var(--line2);background:var(--panel);border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:600}
button:hover{background:var(--panel2)}
button.pri{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
button.pri:hover{filter:brightness(1.08)}
button.bad{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #f1a824;outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap;padding:4px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;width:fit-content;max-width:100%}
.tabs button{border-color:transparent;background:transparent;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.badge{background:var(--chilli);color:#fff;border-radius:10px;padding:0 6px;margin-left:6px;font-size:11px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ticket{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:14px}
.ticket b{font-size:15px}
.ticket .when{color:var(--flag);font-weight:700}
.ticket .contact{color:var(--muted);font-size:12.5px}
.ticket ul{margin:6px 0;padding-left:18px}
.ticket .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ticket button{background:var(--gold);color:var(--on-gold);border:0}
.ticket button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
.flag{background:var(--flag);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}
.need{border:1.5px solid var(--chilli);background:color-mix(in srgb,var(--chilli) 10%,transparent);border-radius:12px;padding:9px 12px;margin-bottom:8px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td input[type=number]{width:74px}
.empty{color:var(--muted);border:1.5px dashed var(--line2);border-radius:12px;padding:16px;text-align:center}
.err{color:var(--bad);font-size:13px;margin:6px 0}
.ok{color:var(--leaf);font-size:13px;font-weight:600}
.chatgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:760px){.chatgrid{grid-template-columns:minmax(0,1fr)}}
.clist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow-y:auto}
.crow{text-align:left;display:block;width:100%;padding:9px 11px}
.crow[aria-current=true]{border-color:var(--gold);background:var(--me)}
.crow small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.thread{display:flex;flex-direction:column;height:min(70vh,640px)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:8px 2px}
.b{max-width:86%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.b.cust{align-self:flex-start;background:var(--agent);border:1px solid var(--line)}
.b.agent{align-self:flex-end;background:var(--me)}
.b.owner{align-self:flex-end;background:var(--maddy);border:1px solid var(--line2)}
.b small{display:block;color:var(--muted);font-size:11px}
.meta{align-self:center;font-size:12px;color:var(--muted)}
form.reply{display:flex;gap:6px;margin-top:8px}
form.reply textarea{flex:1;resize:none;height:44px}
.grid2{display:grid;gap:10px;max-width:560px}
.grid2 label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);font-weight:600}
.grid2 input,.grid2 textarea{font-weight:400;color:var(--cream)}
.days{display:flex;gap:10px;flex-wrap:wrap}
.days label{flex-direction:row;align-items:center;gap:4px;color:var(--cream);font-weight:400}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
details textarea{width:100%;min-height:80px;margin-top:6px}
dialog.cancel{border:0;border-radius:18px;padding:18px;max-width:min(460px,calc(100vw - 32px));background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.cancel::backdrop{background:rgba(10,20,14,.5)}
dialog.cancel h3{margin:0 0 4px;font:700 19px/1.25 var(--f-display)}
dialog.cancel .reasons{display:flex;flex-direction:column;gap:6px;margin:10px 0}
dialog.cancel .reasons button{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-weight:400}
dialog.cancel .reasons button:hover{border-color:var(--gold)}
dialog.cancel textarea{width:100%;box-sizing:border-box;font-weight:400}
dialog.cancel .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
</style>

<style id="ownerRedesignV1">
/* OWNER REDESIGN V1 — operations-focused visual layer */
:root{
  --owner-green:#123f2e;--owner-green-2:#1d6b4d;--owner-cream:#fbf7ef;--owner-warm:#f2eadc;
  --owner-orange:#e7882b;--owner-red:#c94f45;--owner-shadow:0 16px 40px rgba(30,45,35,.10);
}
body.owner-mode{
  max-width:1180px;
  background:
    radial-gradient(700px 360px at 0% 0%,rgba(29,107,77,.10),transparent 72%),
    linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 86%,#fff 14%));
}
.owner-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin:2px 0 14px;padding:16px 18px;border-radius:20px;
  background:linear-gradient(135deg,#103d2c,#1d6b4d);
  color:#fff;box-shadow:0 18px 42px rgba(12,53,36,.22);
}
.owner-brand{display:flex;align-items:center;gap:12px;min-width:0}
.owner-brand img{width:48px;height:48px;border-radius:14px;background:#fff1;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.owner-brand h1{margin:0;color:#fff;font-size:25px}
.owner-brand .sub{margin:2px 0 0;color:rgba(255,255,255,.76)}
.owner-pill{
  flex:none;padding:7px 10px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);
  font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
}
body.owner-mode>.sub#sub{display:none}
body.owner-mode .tabs{
  position:sticky;top:8px;z-index:20;width:100%;margin:0 0 14px;
  padding:5px;border-radius:17px;background:color-mix(in srgb,var(--panel) 91%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 10px 28px rgba(30,45,35,.07);
}
body.owner-mode .tabs button{
  flex:1 1 auto;min-height:42px;border-radius:13px;padding:9px 12px;
  transition:transform .16s ease,background .16s ease;
}
body.owner-mode .tabs button:active{transform:scale(.97)}
body.owner-mode .tabs button[aria-selected=true]{
  background:var(--owner-green);border-color:var(--owner-green);color:#fff;
  box-shadow:0 7px 18px rgba(18,63,46,.18);
}
.owner-kpis{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:4px 0 16px;
}
.owner-kpi{
  position:relative;overflow:hidden;min-height:106px;padding:15px;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--owner-shadow);
}
.owner-kpi::after{
  content:"";position:absolute;width:70px;height:70px;right:-25px;bottom:-30px;
  border-radius:50%;background:color-mix(in srgb,var(--tone) 16%,transparent);
}
.owner-kpi small{
  display:block;color:var(--muted);font-size:11px;font-weight:900;
  text-transform:uppercase;letter-spacing:.08em;
}
.owner-kpi strong{display:block;margin-top:8px;font-size:29px;line-height:1;color:var(--tone)}
.owner-kpi span{display:block;margin-top:7px;color:var(--muted);font-size:12px}
.owner-callout{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 0 16px;padding:14px 16px;border-radius:16px;
  background:color-mix(in srgb,var(--owner-orange) 12%,var(--panel));
  border:1px solid color-mix(in srgb,var(--owner-orange) 32%,var(--line));
}
.owner-callout strong{color:var(--cream)}
.owner-callout span{color:var(--muted);font-size:13px}
body.owner-mode h2{font-size:20px;margin-top:18px}
body.owner-mode .cols{gap:14px}
body.owner-mode .ticket{
  position:relative;border:1px solid var(--line);border-left:0;border-radius:17px;
  padding:14px 14px 13px 18px;box-shadow:0 10px 24px rgba(30,45,35,.07);
  overflow:hidden;transition:transform .18s ease,box-shadow .18s ease;
}
body.owner-mode .ticket::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ticket-tone,var(--owner-green-2));
}
body.owner-mode .ticket:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(30,45,35,.11)}
body.owner-mode .ticket .when{
  display:inline-flex;margin:8px 0 4px;padding:5px 8px;border-radius:8px;
  background:color-mix(in srgb,var(--ticket-tone,var(--owner-orange)) 10%,transparent);
  color:var(--ticket-tone,var(--owner-red));font-weight:800;
}
body.owner-mode .ticket .row:last-child{margin-top:12px}
body.owner-mode .ticket button{min-height:38px;border-radius:10px}
body.owner-mode .need{border-radius:16px;padding:12px 14px}
body.owner-mode .card{border-radius:18px;box-shadow:0 10px 26px rgba(30,45,35,.05)}
body.owner-mode .empty{border-radius:16px}
body.owner-mode .clist .crow{border-radius:12px}
body.owner-mode .thread{border-radius:18px}
body.owner-mode dialog.cancel{border-radius:22px}
@media(max-width:820px){
  .owner-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .owner-head{padding:14px}
  .owner-pill{display:none}
}
@media(max-width:620px){
  body.owner-mode{padding:10px 10px 92px}
  .owner-head{border-radius:17px;margin-bottom:10px}
  .owner-brand img{width:42px;height:42px}
  .owner-brand h1{font-size:21px}
  body.owner-mode .tabs{
    position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));top:auto;
    width:auto;margin:0;z-index:50;border-radius:20px;padding:6px;
  }
  body.owner-mode .tabs button{font-size:11px;padding:8px 6px;min-width:0}
  body.owner-mode .tabs button:nth-child(n+6){display:none}
  .owner-kpis{gap:8px}
  .owner-kpi{min-height:96px;padding:13px}
  .owner-kpi strong{font-size:26px}
  .owner-callout{align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  body.owner-mode .ticket,body.owner-mode .tabs button{transition:none}
}
</style>
</head>
<body class="owner-mode">
<header class="owner-head">
  <div class="owner-brand">
    <img src="/icon.svg" alt="" width="48" height="48">
    <div><h1>Annapurna Kitchen</h1><p class="sub" id="sub">Order desk · only you see this page</p></div>
  </div>
  <div class="owner-pill">Owner console</div>
</header>
<div id="err" class="err" role="alert" hidden></div>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="panel"></div>
<script src="/desk.js" defer></script>
</body>
</html>
